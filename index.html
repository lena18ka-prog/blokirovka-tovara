<div id="screen-start" class="screen active">

</div>

    <button class="btn-cancel" id="btn-writeoff-cancel">Отмена</button>
  </div>
</div>

<div id="screen-notification" class="screen">

// ============================================================
// PENDING — список ожидающих товаров
// step: 'waiting' → ждём пуш, 'notified' → пуш пришёл, готов к выставлению
// ============================================================
let pendingItems = JSON.parse(localStorage.getItem('pendingMarks') || '[]');

let html5QrCode = null;
let isScanning = false;
let lastScannedCode = null;
let lastScanTime = 0;
const COOLDOWN_MS = 2500;
let currentResultCode = '';
let currentNormalizedCode = '';
let currentProductName = '';
let currentStock = '';
let currentStatus = '';
let currentPendingItem = null; // для экрана "выставьте в зал"

// Таймеры пушей: ключ = normalizedCode, значение = timeout id
const pushTimers = {};

function normalizeCode(code) {
  if (!code) return '';
  const trimmed = code.trim();
  if (trimmed.length > 21) return trimmed.substring(0, 21);
  return trimmed;
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  if (id === 'screen-start') updatePendingList();
}

function updatePendingList() {
  const list = document.getElementById('pending-list');
  const count = document.getElementById('pending-count');
  count.textContent = pendingItems.length;
  
  if (pendingItems.length === 0) {
    list.innerHTML = '<div class="pending-empty">Нет товаров, ожидающих решения</div>';
    return;
  }
  
  list.innerHTML = '';
  pendingItems.forEach(item => {
    const div = document.createElement('div');
    const stepClass = item.step === 'notified' ? 'notified' : item.type;
    div.className = `pending-item ${stepClass}`;
    
    let statusText = '';
    if (item.type === 'help') {
      statusText = item.step === 'notified' ? '✅ Заявка обработана — выставить в зал' : '📧 Заявка в хелп';
    } else {
      statusText = item.step === 'notified' ? '✅ Статус изменён — выставить в зал' : '⏳ Заблокирован ОГВ';
    }
    
    const time = new Date(item.timestamp).toLocaleString('ru-RU', {
      day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit'
    });
    div.innerHTML = `
      <div class="pending-status">${statusText}</div>
      <div class="pending-product">${item.productName}</div>
      <div class="pending-time">${time}</div>
    `;
    list.appendChild(div);
  });
}

function showDemoCodes() {
  const list = document.getElementById('demo-list');
  list.innerHTML = '';
  const statusLabels = {
    available: '🟢 Доступно', expired: '🔴 Просрочено', written_off: '🔴 Списано ранее',
    sold: '🔴 Продано ранее', not_ours: '🔴 Не наша марка', no_connection: '🟡 Нет связи',
    not_in_turnover: '🔵 Не введен в оборот', ogv_blocked: '🟣 Заблокирован ОГВ'
  };
  for (const mark of MARKS) {
    const item = document.createElement('div');
    item.className = 'demo-item';
    item.innerHTML = `
      <div class="demo-status">${statusLabels[mark.status]}</div>
      <div class="demo-code" style="margin-bottom:4px">КМ: ${mark.km}</div>
      <div style="font-size:11px;opacity:0.7">${mark.productName} · ${mark.stock}</div>
    `;
    item.onclick = () => {
      navigator.clipboard.writeText(mark.km).then(() => {
        const el = item.querySelector('.demo-status');
        const orig = el.textContent;
        el.textContent = '✓ КМ скопирован';
        setTimeout(() => el.textContent = orig, 1000);
      });
    };
    list.appendChild(item);
  }
  showScreen('screen-demo');
}

function lookupStatus(code) {
  const normalized = code.trim();
  console.log('Сканирован код:', normalized);
  for (const mark of MARKS) {
    if (mark.km === normalized || mark.full === normalized) {
      console.log('Найдено:', mark.km);
      return { status: mark.status, productName: mark.productName, stock: mark.stock, km: mark.km };
    }
    if (normalized.startsWith(mark.km) || mark.full.startsWith(normalized)) {
      console.log('Найдено по префиксу:', mark.km);
      return { status: mark.status, productName: mark.productName, stock: mark.stock, km: mark.km };
    }
  }
  console.log('Не найдено');
  return { status: 'unknown', productName: '', stock: '', km: normalizeCode(normalized) };
}

function speak(text) {
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'ru-RU'; u.rate = 1.05; u.volume = 1;
  const voices = window.speechSynthesis.getVoices();
  const ru = voices.find(v => v.lang.startsWith('ru'));
  if (ru) u.voice = ru;
  window.speechSynthesis.speak(u);
}

function vibrate(pattern) {
  if ('vibrate' in navigator) navigator.vibrate(pattern);
}

function showToast(title, text, duration = 1500) {
  const existing = document.querySelector('.toast');
  if (existing) existing.remove();
  const toast = document.createElement('div');
  toast.className = 'toast';
  toast.innerHTML = `<div style="font-weight:700;margin-bottom:4px">${title}</div><div style="font-size:14px;opacity:0.9">${text}</div>`;
  document.body.appendChild(toast);
  setTimeout(() => {
    toast.style.opacity = '0';
    toast.style.transition = 'opacity 0.3s';
    setTimeout(() => toast.remove(), 300);
  }, duration);
}

async function resetScanner() {
  if (html5QrCode) {
    try {
      if (isScanning) await html5QrCode.stop();
      const reader = document.getElementById('reader');
      while (reader.firstChild) reader.removeChild(reader.firstChild);
      reader.innerHTML = `
        <div class="scan-overlay"><div class="scan-frame"></div></div>
        <div class="scan-loader" id="scan-loader">
          <div class="spinner"></div><span>Запуск камеры...</span>
        </div>`;
    } catch (e) { console.error(e); }
    html5QrCode = null;
  }
  isScanning = false;
}

async function startScanner() {
  if (isScanning) return;
  showScreen('screen-scan');
  const loader = document.getElementById('scan-loader');
  if (loader) {
    loader.classList.remove('hidden');
    loader.innerHTML = '<div class="spinner"></div><span>Запуск камеры...</span>';
  }
  try {
    html5QrCode = new Html5Qrcode("reader", { verbose: false });
    await html5QrCode.start(
      { facingMode: "environment" },
      {
        fps: 15,
        qrbox: (vw, vh) => {
          const size = Math.floor(Math.min(vw, vh) * 0.72);
          return { width: size, height: size };
        },
        formatsToSupport: [
          Html5QrcodeSupportedFormats.DATA_MATRIX,
          Html5QrcodeSupportedFormats.QR_CODE
        ],
        aspectRatio: 1.0,
        experimentalFeatures: { useBarCodeDetectorIfAvailable: true }
      },
      onScanSuccess,
      () => {}
    );
    isScanning = true;
    const loaderEl = document.getElementById('scan-loader');
    if (loaderEl) loaderEl.classList.add('hidden');
  } catch (err) {
    console.error('Ошибка камеры:', err);
    const loaderEl = document.getElementById('scan-loader');
    if (loaderEl) {
      loaderEl.innerHTML = `
        <div class="scan-error">
          <div style="font-size:48px;margin-bottom:12px">📷</div>
          <div>Не удалось запустить камеру</div>
          <div style="font-size:14px;opacity:0.7;margin-top:8px">${err.message}</div>
          <button onclick="resetAndStart()">Повторить</button>
        </div>`;
    }
  }
}

async function resetAndStart() {
  await resetScanner();
  setTimeout(() => startScanner(), 300);
}

async function stopScanner() {
  if (html5QrCode && isScanning) {
    try { await html5QrCode.stop(); } catch (e) {}
  }
  isScanning = false;
}

function findPendingByCode(normalizedCode) {
  return pendingItems.find(p => p.normalizedCode === normalizedCode);
}

function removePendingByCode(normalizedCode) {
  pendingItems = pendingItems.filter(p => p.normalizedCode !== normalizedCode);
  localStorage.setItem('pendingMarks', JSON.stringify(pendingItems));
  // Очищаем таймер если есть
  if (pushTimers[normalizedCode]) {
    clearTimeout(pushTimers[normalizedCode]);
    delete pushTimers[normalizedCode];
  }
}

// ============================================================
// ПУШ — через 30 секунд после добавления в pending
// Меняет step с 'waiting' на 'notified'
// ============================================================
function schedulePush(normalizedCode, delayMs = 30000) {
  if (pushTimers[normalizedCode]) clearTimeout(pushTimers[normalizedCode]);
  pushTimers[normalizedCode] = setTimeout(() => {
    const item = findPendingByCode(normalizedCode);
    if (item && item.step === 'waiting') {
      item.step = 'notified';
      localStorage.setItem('pendingMarks', JSON.stringify(pendingItems));
      console.log('Пуш: step изменён на notified для', normalizedCode);
      // Показываем пуш-уведомление
      showPushNotification(item);
    }
    delete pushTimers[normalizedCode];
  }, delayMs);
}

function showPushNotification(item) {
  const body = document.getElementById('notification-body');
  const message = item.type === 'help'
    ? '✅ Заявка обработана. Отсканируйте марку — статус изменится на «Выставьте в торговый зал».'
    : '✅ Статус марки изменён. Отсканируйте марку — статус изменится на «Выставьте в торговый зал».';
  
  body.innerHTML = `
    <div class="notification-product">
      <div class="notification-product-name">${item.productName}</div>
      <div class="notification-product-status">${message}</div>
      <div style="font-size:12px;opacity:0.7;margin-top:8px">КМ: ${item.normalizedCode}</div>
    </div>
  `;
  showScreen('screen-notification');
  vibrate([200, 100, 200, 100, 300]);
  speak('Уведомление. ' + item.productName + '. ' + (item.type === 'help' ? 'Заявка обработана' : 'Статус изменён'));
}

// ============================================================
// СКАНИРОВАНИЕ — основная логика
// ============================================================
async function onScanSuccess(decodedText) {
  const now = Date.now();
  if (decodedText === lastScannedCode && (now - lastScanTime) < COOLDOWN_MS) return;
  lastScannedCode = decodedText;
  lastScanTime = now;

  vibrate([80, 50, 80]);
  await stopScanner();

  const markData = lookupStatus(decodedText);
  currentResultCode = decodedText;
  currentNormalizedCode = markData.km || normalizeCode(decodedText);
  currentProductName = markData.productName || '';
  currentStock = markData.stock || '';
  currentStatus = markData.status;

  // Проверяем, есть ли товар в pending
  const pendingItem = findPendingByCode(currentNormalizedCode);

  if (pendingItem) {
    // Товар уже в pending
    if (pendingItem.step === 'waiting') {
      // Пуш ещё не пришёл
      showResult({
        bg: '#6b7280', icon: '⏳', title: 'Задание в работе',
        subtitle: 'Ждите уведомления', action: 'ОК', voice: 'Задание уже в работе. Ждите уведомление.', next: 'scan'
      }, decodedText);
    } else if (pendingItem.step === 'notified') {
      // Пуш пришёл — показываем "Выставьте в зал"
      currentPendingItem = pendingItem;
      showResult({
        bg: '#16a34a', icon: '✅', title: 'Выставьте в торговый зал',
        subtitle: pendingItem.type === 'help' 
          ? 'Заявка обработана. Товар готов к продаже.' 
          : 'Статус марки изменён. Товар готов к продаже.',
        action: 'Выставлено', voice: 'Выставьте товар в торговый зал', next: 'remove_pending'
      }, decodedText);
    }
  } else {
    // Товар не в pending — показываем обычный результат
    const config = STATUS_CONFIG[markData.status];
    showResult(config, decodedText);
    speak(config.voice);
  }
}

function showResult(config, code) {
  document.getElementById('screen-result').style.background = config.bg;
  document.getElementById('result-icon').textContent = config.icon;
  document.getElementById('result-title').textContent = config.title;
  document.getElementById('result-product').textContent = currentProductName;
  document.getElementById('result-stock').textContent = currentStock ? `Остаток: ${currentStock}` : '';
  document.getElementById('result-subtitle').textContent = config.subtitle;
  document.getElementById('result-code').textContent = code;
  
  const copyBtn = document.getElementById('btn-copy');
  copyBtn.textContent = '📋 Скопировать код';
  copyBtn.classList.remove('copied');
  copyBtn.onclick = () => {
    navigator.clipboard.writeText(code).then(() => {
      copyBtn.textContent = '✓ Скопировано';
      copyBtn.classList.add('copied');
      setTimeout(() => {
        copyBtn.textContent = '📋 Скопировать код';
        copyBtn.classList.remove('copied');
      }, 1500);
    });
  };

  const btn = document.getElementById('btn-action');
  btn.textContent = config.action;
  btn.onclick = () => handleResultAction(config);

  showScreen('screen-result');
  if (config.voice) speak(config.voice);
}

function handleResultAction(config) {
  if (config.next === 'writeoff') {
    showScreen('screen-writeoff');
  } else if (config.next === 'add_pending') {
    // Добавляем в pending и запускаем таймер пуша
    addToPending(currentStatus === 'ogv_blocked' ? 'ogv' : 'help', 
                 currentProductName, currentResultCode, currentNormalizedCode);
    schedulePush(currentNormalizedCode, 30000); // 30 секунд
    showToast(
      currentStatus === 'ogv_blocked' ? '⏳ Товар отложен' : '📧 Заявка создана',
      'Пуш придёт через 30 секунд'
    );
    setTimeout(() => resetAndStart(), 1200);
  } else if (config.next === 'remove_pending') {
    // Удаляем из pending — цикл завершён
    removePendingByCode(currentNormalizedCode);
    showToast('✅ Товар выставлен в зал', 'Задание выполнено');
    speak('Товар выставлен в торговый зал');
    currentPendingItem = null;
    setTimeout(() => resetAndStart(), 1200);
  } else if (config.next === 'reload') {
    window.location.reload();
  } else if (config.next === 'scan') {
    resetAndStart();
  }
}

function addToPending(type, productName, code, normalizedCode) {
  const existing = findPendingByCode(normalizedCode);
  if (existing) {
    console.log('Дубликат:', normalizedCode);
    return false;
  }
  const item = {
    type: type,
    productName: productName,
    code: code,
    normalizedCode: normalizedCode,
    timestamp: Date.now(),
    step: 'waiting'
  };
  pendingItems.push(item);
  localStorage.setItem('pendingMarks', JSON.stringify(pendingItems));
  console.log('Добавлено в pending:', normalizedCode);
  return true;
}

// ============================================================
// КНОПКИ
// ============================================================
document.getElementById('btn-scan-back').onclick = () => {
  showScreen('screen-start');
};

document.getElementById('btn-writeoff-confirm').onclick = () => {
  vibrate([100, 50, 100, 50, 200]);
  speak('Списание подтверждено');
  resetAndStart();
};
document.getElementById('btn-writeoff-cancel').onclick = () => resetAndStart();

document.getElementById('btn-notification-close').onclick = () => {
  showScreen('screen-start');
};

document.getElementById('btn-test-push').onclick = () => {
  // Находим первый товар в pending со step='waiting' и сразу делаем notified
  const item = pendingItems.find(p => p.step === 'waiting');
  if (item) {
    if (pushTimers[item.normalizedCode]) {
      clearTimeout(pushTimers[item.normalizedCode]);
      delete pushTimers[item.normalizedCode];
    }
    item.step = 'notified';
    localStorage.setItem('pendingMarks', JSON.stringify(pendingItems));
    showPushNotification(item);
  } else {
    showToast('Нет ожидающих товаров', 'Отсканируйте марку ОГВ или хелп');
  }
};

document.getElementById('btn-start').onclick = () => {
  if ('speechSynthesis' in window) {
    window.speechSynthesis.getVoices();
    const w = new SpeechSynthesisUtterance('');
    w.volume = 0;
    window.speechSynthesis.speak(w);
  }
  startScanner();
};

document.getElementById('btn-demo').onclick = showDemoCodes;
document.getElementById('btn-demo-back').onclick = () => showScreen('screen-start');

if ('speechSynthesis' in window) {
  window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
}

updatePendingList();
</script>
