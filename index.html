<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

<title>Проверка марок · Честный Знак</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #1a1a1a;
    color: #fff;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
  }
  .screen {
    position: absolute;
    inset: 0;
    display: none;
    flex-direction: column;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .screen.active { display: flex; }

  #screen-start {
    background: #1a1a1a;
    overflow-y: auto;
  }
  .start-header {
    background: linear-gradient(135deg, #1e3a8a, #3b82f6);
    padding: 24px;
    text-align: center;
  }
  .start-header h1 { font-size: 28px; margin-bottom: 8px; }
  .start-header p { font-size: 14px; opacity: 0.9; }
  .btn-start {
    background: #fff;
    color: #1e3a8a;
    border: none;
    padding: 18px 40px;
    font-size: 18px;
    font-weight: 700;
    border-radius: 16px;
    cursor: pointer;
    box-shadow: 0 8px 24px rgba(0,0,0,0.25);
    margin-top: 16px;
    width: 100%;
    max-width: 320px;
  }
  .btn-start:active { transform: scale(0.97); }
  .btn-demo {
    background: rgba(255,255,255,0.2);
    color: #fff;
    border: 2px solid rgba(255,255,255,0.5);
    padding: 14px 32px;
    font-size: 16px;
    font-weight: 600;
    border-radius: 12px;
    cursor: pointer;
    margin-top: 12px;
    width: 100%;
    max-width: 320px;
  }
  .btn-demo:active { transform: scale(0.97); }
  .btn-test-push {
    background: rgba(255,255,255,0.15);
    color: #fff;
    border: 1px solid rgba(255,255,255,0.3);
    padding: 12px 24px;
    font-size: 14px;
    font-weight: 600;
    border-radius: 10px;
    cursor: pointer;
    margin-top: 12px;
    width: 100%;
    max-width: 320px;
  }
  .btn-test-push:active { transform: scale(0.97); }
  
  .pending-section {
    padding: 20px;
    flex: 1;
  }
  .pending-header {
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .pending-count {
    background: #f59e0b;
    color: #000;
    padding: 2px 8px;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 700;
  }
  .pending-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
    max-height: 50vh;
    overflow-y: auto;
  }
  .pending-item {
    background: rgba(255,255,255,0.08);
    border-radius: 12px;
    padding: 14px;
    border-left: 4px solid;
  }
  .pending-item.help { border-left-color: #0284c7; }
  .pending-item.ogv { border-left-color: #7c3aed; }
  .pending-item.notified { border-left-color: #16a34a; }
  .pending-status {
    font-size: 12px;
    font-weight: 700;
    margin-bottom: 6px;
  }
  .pending-product {
    font-size: 14px;
    margin-bottom: 4px;
    line-height: 1.3;
  }
  .pending-time {
    font-size: 11px;
    opacity: 0.7;
  }
  .pending-empty {
    text-align: center;
    padding: 40px 20px;
    opacity: 0.5;
    font-size: 14px;
  }

  #screen-demo {
    background: #0f172a;
    padding: 24px;
    overflow-y: auto;
  }
  .demo-header {
    font-size: 24px;
    font-weight: 700;
    margin-bottom: 20px;
    text-align: center;
  }
  .demo-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 24px;
  }
  .demo-item {
    background: rgba(255,255,255,0.1);
    border-radius: 12px;
    padding: 16px;
    cursor: pointer;
  }
  .demo-item:active { background: rgba(255,255,255,0.2); }
  .demo-status {
    font-size: 14px;
    font-weight: 700;
    margin-bottom: 8px;
  }
  .demo-code {
    font-size: 12px;
    font-family: monospace;
    opacity: 0.9;
    word-break: break-all;
  }
  .btn-back {
    background: rgba(255,255,255,0.2);
    color: #fff;
    border: none;
    padding: 16px;
    font-size: 18px;
    font-weight: 600;
    border-radius: 12px;
    cursor: pointer;
    width: 100%;
  }

  #screen-scan { background: #000; }
  .scan-header {
    padding: 12px 16px;
    background: rgba(0,0,0,0.85);
    backdrop-filter: blur(10px);
    display: flex;
    align-items: center;
    justify-content: space-between;
    z-index: 10;
    gap: 12px;
  }
  .scan-header-title {
    font-size: 16px;
    font-weight: 600;
    flex: 1;
    text-align: center;
  }
  .btn-scan-back {
    background: rgba(255,255,255,0.15);
    color: #fff;
    border: 1px solid rgba(255,255,255,0.3);
    padding: 8px 14px;
    font-size: 14px;
    font-weight: 600;
    border-radius: 10px;
    cursor: pointer;
    white-space: nowrap;
  }
  .btn-scan-back:active { background: rgba(255,255,255,0.25); }
  
  #reader { flex: 1; position: relative; overflow: hidden; }
  #reader video {
    width: 100% !important;
    height: 100% !important;
    object-fit: cover !important;
  }
  #reader__scan_region { width: 100%; height: 100%; }
  #reader__scan_region video { width: 100% !important; height: 100% !important; }
  #reader__dashboard { display: none !important; }
  .scan-overlay {
    position: absolute;
    inset: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    pointer-events: none;
    z-index: 5;
  }
  .scan-frame {
    width: min(75vw, 320px);
    height: min(75vw, 320px);
    border: 3px solid rgba(255,255,255,0.9);
    border-radius: 20px;
    box-shadow: 0 0 0 9999px rgba(0,0,0,0.45);
    position: relative;
  }
  .scan-frame::before {
    content: "Наведите камеру на марку";
    position: absolute;
    bottom: -40px;
    left: 50%;
    transform: translateX(-50%);
    color: #fff;
    font-size: 14px;
    white-space: nowrap;
    text-shadow: 0 2px 4px rgba(0,0,0,0.8);
  }
  .scan-loader {
    position: absolute;
    inset: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    background: rgba(0,0,0,0.8);
    color: #fff;
    font-size: 16px;
    z-index: 20;
  }
  .scan-loader.hidden { display: none; }
  .spinner {
    width: 32px;
    height: 32px;
    border: 3px solid rgba(255,255,255,0.3);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin-right: 12px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  #screen-result {
    justify-content: center;
    align-items: center;
    padding: 24px 20px;
    text-align: center;
  }
  .result-icon {
    font-size: 70px;
    margin-bottom: 16px;
  }
  .result-title {
    font-size: 28px;
    font-weight: 800;
    margin-bottom: 8px;
  }
  .result-product {
    font-size: 16px;
    margin-bottom: 8px;
    opacity: 0.95;
  }
  .result-stock {
    font-size: 14px;
    margin-bottom: 12px;
    opacity: 0.9;
  }
  .result-subtitle {
    font-size: 18px;
    margin-bottom: 20px;
    opacity: 0.95;
  }
  .result-code {
    font-size: 11px;
    opacity: 0.7;
    margin-bottom: 12px;
    word-break: break-all;
    font-family: monospace;
  }
  .btn-copy {
    background: rgba(0,0,0,0.3);
    color: #fff;
    border: 1px solid rgba(255,255,255,0.3);
    padding: 10px 20px;
    font-size: 14px;
    font-weight: 600;
    border-radius: 10px;
    cursor: pointer;
    margin-bottom: 16px;
  }
  .btn-action {
    background: rgba(255,255,255,0.95);
    color: #1a1a1a;
    border: none;
    padding: 18px 40px;
    font-size: 18px;
    font-weight: 700;
    border-radius: 16px;
    cursor: pointer;
    min-width: 220px;
  }
  .btn-action:active { transform: scale(0.97); }

  #screen-writeoff {
    background: #2a0a0a;
    justify-content: center;
    align-items: center;
    padding: 32px 24px;
    text-align: center;
  }
  #screen-writeoff h2 { font-size: 28px; margin-bottom: 16px; }
  #screen-writeoff p {
    font-size: 16px;
    opacity: 0.85;
    margin-bottom: 32px;
  }
  .writeoff-buttons {
    display: flex;
    flex-direction: column;
    gap: 12px;
    width: 100%;
    max-width: 320px;
  }
  .btn-confirm {
    background: #f44336;
    color: #fff;
    border: none;
    padding: 18px;
    font-size: 18px;
    font-weight: 700;
    border-radius: 14px;
    cursor: pointer;
  }
  .btn-cancel {
    background: rgba(255,255,255,0.15);
    color: #fff;
    border: none;
    padding: 18px;
    font-size: 18px;
    font-weight: 600;
    border-radius: 14px;
    cursor: pointer;
  }

  #screen-notification {
    background: rgba(0,0,0,0.95);
    padding: 0;
  }
  .notification-banner {
    background: #1e3a8a;
    padding: 20px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .notification-icon { font-size: 32px; }
  .notification-content { flex: 1; }
  .notification-title { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
  .notification-text { font-size: 14px; opacity: 0.9; }
  .notification-body {
    padding: 24px 20px;
  }
  .notification-product {
    background: rgba(255,255,255,0.1);
    border-radius: 12px;
    padding: 16px;
  }
  .notification-product-name { font-size: 16px; font-weight: 600; margin-bottom: 8px; }
  .notification-product-status { font-size: 14px; opacity: 0.9; }
  .btn-notification-close {
    background: rgba(255,255,255,0.2);
    color: #fff;
    border: none;
    padding: 18px;
    font-size: 18px;
    font-weight: 600;
    border-radius: 14px;
    cursor: pointer;
    margin: 20px;
    width: calc(100% - 40px);
  }

  .toast {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: #1e3a8a;
    color: #fff;
    padding: 16px 24px;
    border-radius: 12px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    z-index: 2000;
    max-width: 90%;
    text-align: center;
  }
</style>
</head>
<body>

<div id="screen-start" class="screen active">
  <div class="start-header">
    <h1>Проверка марок</h1>
    <p>Сканирование DataMatrix · Честный Знак</p>
    <button class="btn-start" id="btn-start">Начать работу</button>
    <button class="btn-demo" id="btn-demo">Показать тестовые коды</button>
    <button class="btn-test-push" id="btn-test-push">🔔 Тест пуша</button>
  </div>
  <div class="pending-section">
    <div class="pending-header">
      Ожидают решения
      <span class="pending-count" id="pending-count">0</span>
    </div>
    <div class="pending-list" id="pending-list"></div>
  </div>
</div>

<div id="screen-demo" class="screen">
  <div class="demo-header">Тестовые коды</div>
  <div class="demo-list" id="demo-list"></div>
  <button class="btn-back" id="btn-demo-back">Назад</button>
</div>

<div id="screen-scan" class="screen">
  <div class="scan-header">
    <button class="btn-scan-back" id="btn-scan-back">← К списку</button>
    <div class="scan-header-title">Наведите камеру на марку</div>
    <div style="width:80px"></div>
  </div>
  <div id="reader">
    <div class="scan-overlay">
      <div class="scan-frame"></div>
    </div>
    <div class="scan-loader" id="scan-loader">
      <div class="spinner"></div>
      <span>Запуск камеры...</span>
    </div>
  </div>
</div>

<div id="screen-result" class="screen">
  <div class="result-icon" id="result-icon"></div>
  <div class="result-title" id="result-title"></div>
  <div class="result-product" id="result-product"></div>
  <div class="result-stock" id="result-stock"></div>
  <div class="result-subtitle" id="result-subtitle"></div>
  <div class="result-code" id="result-code"></div>
  <button class="btn-copy" id="btn-copy">📋 Скопировать код</button>
  <button class="btn-action" id="btn-action"></button>
</div>

<div id="screen-writeoff" class="screen">
  <h2>⚠️ Списание товара</h2>
  <p>Подтвердите списание просроченного товара</p>
  <div class="writeoff-buttons">
    <button class="btn-confirm" id="btn-writeoff-confirm">Подтвердить списание</button>
    <button class="btn-cancel" id="btn-writeoff-cancel">Отмена</button>
  </div>
</div>

<div id="screen-notification" class="screen">
  <div class="notification-banner">
    <div class="notification-icon">🔔</div>
    <div class="notification-content">
      <div class="notification-title">Уведомление</div>
      <div class="notification-text">Проверьте товар</div>
    </div>
  </div>
  <div class="notification-body" id="notification-body"></div>
  <button class="btn-notification-close" id="btn-notification-close">Понятно</button>
</div>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
const MARKS = [
  { km: "04620081141216VX39Rfe", full: "04620081141216VX39RfeAAAAdKhW", status: "ogv_blocked", productName: "ХИТС Бирюзовый DM Стик (ФМ): 10/500", stock: "12 шт." },
  { km: "00000046218636j<St'eH", full: "00000046218636j<St'eHAC3AbwCy", status: "not_in_turnover", productName: "ВОГ СС Блю Сигареты МРЦ172(БАТ):10/500", stock: "5 шт." },
  { km: "00000046218636RCAQXt9", full: "00000046218636RCAQXt9AC3AIK0j", status: "not_in_turnover", productName: "ВОГ СС Блю Сигареты МРЦ172(БАТ):10/500", stock: "3 шт." },
  { km: "00000046209825d_2RRzC", full: "00000046209825d_2RRzCAD=Us7ra", status: "sold", productName: "ВИНСТОН Xsence Серые Сигареты МРЦ253(ДжТи):10/500", stock: "0 шт." },
  { km: "04606203101023V*WyXZM", full: "04606203101023V*WyXZMAC=UCfo9", status: "sold", productName: "НЕКСТ СС Росе Сигареты МРЦ189(ФМ):10/500", stock: "0 шт." },
  { km: "04627146197164r&h0VL&", full: "04627146197164r&h0VL&AAAAyB5Z", status: "expired", productName: "ATTACKER ОЭС Ананас манго маракуйя 800 тяг (МАБАР):10/300", stock: "8 шт." },
  { km: "04660048363510W0YkKvI", full: "04660048363510W0YkKvIAAAAXGHV", status: "expired", productName: "Vuse Про 5000 Клубника Киви Эл Сиг (SST):10/160", stock: "2 шт." }
];

const STATUS_CONFIG = {
  available: { bg: '#16a34a', icon: '✅', title: 'Доступно', subtitle: 'Выставьте в зал', action: 'ОК', voice: 'Товар доступен к продаже', next: 'scan' },
  expired: { bg: '#dc2626', icon: '⛔', title: 'Просрочено', subtitle: 'Проведите списание', action: 'Списать', voice: 'Товар просрочен', next: 'writeoff' },
  written_off: { bg: '#dc2626', icon: '🚫', title: 'Списано ранее', subtitle: 'Утилизируйте товар', action: 'Утилизировать', voice: 'Марка списана ранее', next: 'scan' },
  sold: { bg: '#dc2626', icon: '🚫', title: 'Продано ранее', subtitle: 'Утилизируйте товар', action: 'Утилизировать', voice: 'Марка продана ранее', next: 'scan' },
  not_ours: { bg: '#dc2626', icon: '❌', title: 'Не наша марка', subtitle: 'Утилизируйте товар', action: 'Утилизировать', voice: 'Марка не принадлежит компании', next: 'scan' },
  no_connection: { bg: '#f59e0b', icon: '📡', title: 'Нет связи', subtitle: 'Повторите попытку', action: 'Повторить', voice: 'Нет связи с сервером', next: 'reload' },
  not_in_turnover: { bg: '#0284c7', icon: '📧', title: 'Код не введен в оборот', subtitle: 'Требуется заявка', action: 'В хелп', voice: 'Код не введен в оборот', next: 'add_pending' },
  ogv_blocked: { bg: '#7c3aed', icon: '⏳', title: 'Код заблокирован ОГВ', subtitle: 'Отложите товар', action: 'Отложить', voice: 'Код заблокирован ОГВ', next: 'add_pending' },
  unknown: { bg: '#6b7280', icon: '', title: 'Марка не найдена', subtitle: 'Код отсутствует в базе', action: 'ОК', voice: 'Марка не найдена', next: 'scan' }
};

let pendingItems = JSON.parse(localStorage.getItem('pendingMarks') || '[]');
let html5QrCode = null;
let isScanning = false;
let lastScannedCode = null;
let lastScanTime = 0;
const COOLDOWN_MS = 2500;
let currentCode = '';
let currentKm = '';
let currentName = '';
let currentStock = '';
let currentStatus = '';
let currentPendingItem = null;
let pushTimers = {};

function normalizeCode(code) {
  if (!code) return '';
  const t = code.trim();
  return t.length > 21 ? t.substring(0, 21) : t;
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  if (id === 'screen-start') updatePendingList();
}

function updatePendingList() {
  const list = document.getElementById('pending-list');
  const count = document.getElementById('pending-count');
  count.textContent = pendingItems.length;
  if (pendingItems.length === 0) {
    list.innerHTML = '<div class="pending-empty">Нет товаров, ожидающих решения</div>';
    return;
  }
  list.innerHTML = '';
  pendingItems.forEach(item => {
    const div = document.createElement('div');
    div.className = `pending-item ${item.step === 'notified' ? 'notified' : item.type}`;
    let statusText = '';
    if (item.type === 'help') {
      statusText = item.step === 'notified' ? '✅ Заявка обработана' : ' Заявка в хелп';
    } else {
      statusText = item.step === 'notified' ? '✅ Статус изменён' : '⏳ Заблокирован ОГВ';
    }
    const time = new Date(item.timestamp).toLocaleString('ru-RU', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
    div.innerHTML = `<div class="pending-status">${statusText}</div><div class="pending-product">${item.productName}</div><div class="pending-time">${time}</div>`;
    list.appendChild(div);
  });
}

function showDemoCodes() {
  const list = document.getElementById('demo-list');
  list.innerHTML = '';
  const labels = { available: '🟢 Доступно', expired: '🔴 Просрочено', written_off: '🔴 Списано ранее', sold: '🔴 Продано ранее', not_ours: '🔴 Не наша марка', no_connection: '🟡 Нет связи', not_in_turnover: '🔵 Не введен в оборот', ogv_blocked: '🟣 Заблокирован ОГВ' };
  for (const mark of MARKS) {
    const item = document.createElement('div');
    item.className = 'demo-item';
    item.innerHTML = `<div class="demo-status">${labels[mark.status]}</div><div class="demo-code" style="margin-bottom:4px">КМ: ${mark.km}</div><div style="font-size:11px;opacity:0.7">${mark.productName} · ${mark.stock}</div>`;
    item.onclick = () => {
      navigator.clipboard.writeText(mark.km).then(() => {
        const el = item.querySelector('.demo-status');
        const orig = el.textContent;
        el.textContent = '✓ Скопирован';
        setTimeout(() => el.textContent = orig, 1000);
      });
    };
    list.appendChild(item);
  }
  showScreen('screen-demo');
}

function lookupStatus(code) {
  const n = code.trim();
  for (const mark of MARKS) {
    if (mark.km === n || mark.full === n || n.startsWith(mark.km) || mark.full.startsWith(n)) {
      return { status: mark.status, productName: mark.productName, stock: mark.stock, km: mark.km };
    }
  }
  return { status: 'unknown', productName: '', stock: '', km: normalizeCode(n) };
}

function speak(text) {
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'ru-RU'; u.rate = 1.05; u.volume = 1;
  const voices = window.speechSynthesis.getVoices();
  const ru = voices.find(v => v.lang.startsWith('ru'));
  if (ru) u.voice = ru;
  window.speechSynthesis.speak(u);
}

function vibrate(pattern) {
  if ('vibrate' in navigator) navigator.vibrate(pattern);
}

function showToast(title, text) {
  const existing = document.querySelector('.toast');
  if (existing) existing.remove();
  const toast = document.createElement('div');
  toast.className = 'toast';
  toast.innerHTML = `<div style="font-weight:700;margin-bottom:4px">${title}</div><div style="font-size:14px;opacity:0.9">${text}</div>`;
  document.body.appendChild(toast);
  setTimeout(() => toast.remove(), 2000);
}

async function startScanner() {
  if (isScanning) return;
  showScreen('screen-scan');
  const loader = document.getElementById('scan-loader');
  if (loader) {
    loader.classList.remove('hidden');
    loader.innerHTML = '<div class="spinner"></div><span>Запуск камеры...</span>';
  }
  try {
    if (!html5QrCode) html5QrCode = new Html5Qrcode("reader", { verbose: false });
    await html5QrCode.start(
      { facingMode: "environment" },
      { fps: 15, qrbox: (vw, vh) => ({ width: Math.floor(Math.min(vw, vh) * 0.72), height: Math.floor(Math.min(vw, vh) * 0.72) }), formatsToSupport: [Html5QrcodeSupportedFormats.DATA_MATRIX, Html5QrcodeSupportedFormats.QR_CODE], aspectRatio: 1.0, experimentalFeatures: { useBarCodeDetectorIfAvailable: true } },
      onScanSuccess,
      () => {}
    );
    isScanning = true;
    const loaderEl = document.getElementById('scan-loader');
    if (loaderEl) loaderEl.classList.add('hidden');
  } catch (err) {
    console.error('Ошибка камеры:', err);
  }
}

async function stopScanner() {
  if (html5QrCode && isScanning) {
    try { await html5QrCode.stop(); } catch (e) {}
  }
  isScanning = false;
}

function findPendingByCode(km) {
  return pendingItems.find(p => p.normalizedCode === km);
}

function removePendingByCode(km) {
  pendingItems = pendingItems.filter(p => p.normalizedCode !== km);
  localStorage.setItem('pendingMarks', JSON.stringify(pendingItems));
  if (pushTimers[km]) { clearTimeout(pushTimers[km]); delete pushTimers[km]; }
}

function schedulePush(km, delayMs = 30000) {
  if (pushTimers[km]) clearTimeout(pushTimers[km]);
  pushTimers[km] = setTimeout(() => {
    const item = findPendingByCode(km);
    if (item && item.step === 'waiting') {
      item.step = 'notified';
      localStorage.setItem('pendingMarks', JSON.stringify(pendingItems));
      showPushNotification(item);
    }
    delete pushTimers[km];
  }, delayMs);
}

function showPushNotification(item) {
  const body = document.getElementById('notification-body');
  const msg = item.type === 'help' ? 'Заявка обработана. Отсканируйте марку.' : 'Статус изменён. Отсканируйте марку.';
  body.innerHTML = `<div class="notification-product"><div class="notification-product-name">${item.productName}</div><div class="notification-product-status">${msg}</div><div style="font-size:12px;opacity:0.7;margin-top:8px">КМ: ${item.normalizedCode}</div></div>`;
  showScreen('screen-notification');
  vibrate([200, 100, 200, 100, 300]);
  speak('Уведомление. ' + item.productName);
}

async function onScanSuccess(decodedText) {
  const now = Date.now();
  if (decodedText === lastScannedCode && (now - lastScanTime) < COOLDOWN_MS) return;
  lastScannedCode = decodedText;
  lastScanTime = now;
  vibrate([80, 50, 80]);
  await stopScanner();

  const markData = lookupStatus(decodedText);
  currentCode = decodedText;
  currentKm = markData.km || normalizeCode(decodedText);
  currentName = markData.productName || '';
  currentStock = markData.stock || '';
  currentStatus = markData.status;

  const pendingItem = findPendingByCode(currentKm);

  if (pendingItem) {
    if (pendingItem.step === 'waiting') {
      showResult({ bg: '#6b7280', icon: '⏳', title: 'Задание в работе', subtitle: 'Ждите уведомления', action: 'ОК', voice: 'Задание уже в работе', next: 'scan' });
    } else if (pendingItem.step === 'notified') {
      currentPendingItem = pendingItem;
      showResult({ bg: '#16a34a', icon: '✅', title: 'Выставьте в торговый зал', subtitle: 'Товар готов к продаже', action: 'Выставлено', voice: 'Выставьте товар в зал', next: 'remove_pending' });
    }
  } else {
    const config = STATUS_CONFIG[markData.status];
    showResult(config);
  }
}

function showResult(config) {
  document.getElementById('screen-result').style.background = config.bg;
  document.getElementById('result-icon').textContent = config.icon;
  document.getElementById('result-title').textContent = config.title;
  document.getElementById('result-product').textContent = currentName;
  document.getElementById('result-stock').textContent = currentStock ? `Остаток: ${currentStock}` : '';
  document.getElementById('result-subtitle').textContent = config.subtitle;
  document.getElementById('result-code').textContent = currentCode;
  
  const copyBtn = document.getElementById('btn-copy');
  copyBtn.onclick = () => {
    navigator.clipboard.writeText(currentCode).then(() => {
      copyBtn.textContent = '✓ Скопировано';
      setTimeout(() => copyBtn.textContent = '📋 Скопировать код', 1500);
    });
  };

  const btn = document.getElementById('btn-action');
  btn.textContent = config.action;
  btn.onclick = () => handleResultAction(config);

  showScreen('screen-result');
  speak(config.voice);
}

function handleResultAction(config) {
  if (config.next === 'writeoff') {
    showScreen('screen-writeoff');
  } else if (config.next === 'add_pending') {
    const type = currentStatus === 'ogv_blocked' ? 'ogv' : 'help';
    const existing = findPendingByCode(currentKm);
    if (!existing) {
      pendingItems.push({ type, productName: currentName, code: currentCode, normalizedCode: currentKm, timestamp: Date.now(), step: 'waiting' });
      localStorage.setItem('pendingMarks', JSON.stringify(pendingItems));
      schedulePush(currentKm, 30000);
    }
    showToast(type === 'ogv' ? '⏳ Товар отложен' : '📧 Заявка создана', 'Пуш через 30 сек');
    setTimeout(() => startScanner(), 500);
  } else if (config.next === 'remove_pending') {
    removePendingByCode(currentKm);
    showToast('✅ Товар выставлен в зал', 'Задание выполнено');
    currentPendingItem = null;
    setTimeout(() => startScanner(), 500);
  } else if (config.next === 'reload') {
    window.location.reload();
  } else if (config.next === 'scan') {
    setTimeout(() => startScanner(), 500);
  }
}

document.getElementById('btn-scan-back').onclick = () => showScreen('screen-start');
document.getElementById('btn-writeoff-confirm').onclick = () => { vibrate([100, 50, 100, 50, 200]); speak('Списание подтверждено'); setTimeout(() => startScanner(), 500); };
document.getElementById('btn-writeoff-cancel').onclick = () => setTimeout(() => startScanner(), 500);
document.getElementById('btn-notification-close').onclick = () => showScreen('screen-start');

document.getElementById('btn-test-push').onclick = () => {
  const item = pendingItems.find(p => p.step === 'waiting');
  if (item) {
    if (pushTimers[item.normalizedCode]) { clearTimeout(pushTimers[item.normalizedCode]); delete pushTimers[item.normalizedCode]; }
    item.step = 'notified';
    localStorage.setItem('pendingMarks', JSON.stringify(pendingItems));
    showPushNotification(item);
  } else {
    showToast('Нет ожидающих товаров', 'Отсканируйте марку ОГВ или хелп');
  }
};

document.getElementById('btn-start').onclick = () => {
  if ('speechSynthesis' in window) {
    window.speechSynthesis.getVoices();
    const w = new SpeechSynthesisUtterance('');
    w.volume = 0;
    window.speechSynthesis.speak(w);
  }
  startScanner();
};

document.getElementById('btn-demo').onclick = showDemoCodes;
document.getElementById('btn-demo-back').onclick = () => showScreen('screen-start');

if ('speechSynthesis' in window) {
  window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
}

updatePendingList();
</script>
