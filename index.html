<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000">
<title>Проверка марок · Честный Знак</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #000;
    color: #fff;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
  }
  
  #screen-start {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    background: #1a1a1a;
    overflow-y: auto;
    z-index: 100;
  }
  #screen-start.hidden { display: none; }
  .start-header {
    background: linear-gradient(135deg, #1e3a8a, #3b82f6);
    padding: 24px;
    text-align: center;
  }
  .start-header h1 { font-size: 28px; margin-bottom: 8px; }
  .start-header p { font-size: 14px; opacity: 0.9; }
  .btn-start {
    background: #fff;
    color: #1e3a8a;
    border: none;
    padding: 18px 40px;
    font-size: 18px;
    font-weight: 700;
    border-radius: 16px;
    cursor: pointer;
    box-shadow: 0 8px 24px rgba(0,0,0,0.25);
    margin-top: 16px;
    width: 100%;
    max-width: 320px;
  }
  .btn-start:active { transform: scale(0.97); }
  .btn-demo {
    background: rgba(255,255,255,0.15);
    color: #fff;
    border: 1px solid rgba(255,255,255,0.3);
    padding: 14px 32px;
    font-size: 16px;
    font-weight: 600;
    border-radius: 12px;
    cursor: pointer;
    margin-top: 12px;
    width: 100%;
    max-width: 320px;
  }
  .btn-demo:active { transform: scale(0.97); }
  
  #screen-scan {
    position: absolute;
    inset: 0;
    background: #000;
    display: none;
    flex-direction: column;
  }
  #screen-scan.active { display: flex; }
  
  .scan-header {
    padding: 12px 16px;
    background: rgba(0,0,0,0.75);
    backdrop-filter: blur(10px);
    display: flex;
    align-items: center;
    justify-content: space-between;
    z-index: 30;
    gap: 12px;
  }
  .scan-header-title {
    font-size: 16px;
    font-weight: 600;
    flex: 1;
    text-align: center;
  }
  .btn-scan-back {
    background: rgba(255,255,255,0.15);
    color: #fff;
    border: 1px solid rgba(255,255,255,0.3);
    padding: 8px 14px;
    font-size: 14px;
    font-weight: 600;
    border-radius: 10px;
    cursor: pointer;
    white-space: nowrap;
  }
  .btn-scan-back:active { background: rgba(255,255,255,0.25); }
  
  #reader {
    flex: 1;
    position: relative;
    overflow: hidden;
  }
  #reader video {
    width: 100% !important;
    height: 100% !important;
    object-fit: cover !important;
  }
  #reader__scan_region { width: 100%; height: 100%; }
  #reader__scan_region video { width: 100% !important; height: 100% !important; }
  #reader__dashboard { display: none !important; }
  
  .scan-overlay-frame {
    position: absolute;
    inset: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    pointer-events: none;
    z-index: 5;
  }
  .scan-frame {
    width: min(75vw, 320px);
    height: min(75vw, 320px);
    border: 3px solid rgba(255,255,255,0.9);
    border-radius: 20px;
    box-shadow: 0 0 0 9999px rgba(0,0,0,0.45);
    position: relative;
  }
  .scan-frame::before {
    content: "Наведите камеру на марку";
    position: absolute;
    bottom: -40px;
    left: 50%;
    transform: translateX(-50%);
    color: #fff;
    font-size: 14px;
    white-space: nowrap;
    text-shadow: 0 2px 4px rgba(0,0,0,0.8);
  }

  .overlay {
    position: absolute;
    inset: 0;
    display: none;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 24px 20px;
    text-align: center;
    z-index: 50;
    animation: fadeIn 0.2s ease-out;
  }
  .overlay.active { display: flex; }
  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  .overlay-icon {
    font-size: 70px;
    margin-bottom: 16px;
    animation: pop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  @keyframes pop {
    0% { transform: scale(0); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }
  .overlay-title {
    font-size: 28px;
    font-weight: 800;
    margin-bottom: 8px;
    line-height: 1.1;
  }
  .overlay-product {
    font-size: 16px;
    margin-bottom: 8px;
    opacity: 0.95;
    line-height: 1.3;
    max-width: 100%;
    padding: 0 12px;
  }
  .overlay-stock {
    font-size: 14px;
    margin-bottom: 12px;
    opacity: 0.9;
  }
  .overlay-subtitle {
    font-size: 18px;
    margin-bottom: 20px;
    opacity: 0.95;
    line-height: 1.3;
  }
  .overlay-code {
    font-size: 11px;
    opacity: 0.7;
    margin-bottom: 12px;
    word-break: break-all;
    max-width: 100%;
    font-family: monospace;
    padding: 0 12px;
  }
  .btn-copy {
    background: rgba(0,0,0,0.3);
    color: #fff;
    border: 1px solid rgba(255,255,255,0.3);
    padding: 10px 20px;
    font-size: 14px;
    font-weight: 600;
    border-radius: 10px;
    cursor: pointer;
    margin-bottom: 16px;
  }
  .btn-copy:active { transform: scale(0.97); }
  .btn-action {
    background: rgba(255,255,255,0.95);
    color: #1a1a1a;
    border: none;
    padding: 18px 40px;
    font-size: 18px;
    font-weight: 700;
    border-radius: 16px;
    cursor: pointer;
    min-width: 220px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.2);
  }
  .btn-action:active { transform: scale(0.97); }

  .overlay-writeoff {
    background: rgba(42, 10, 10, 0.97);
  }
  .overlay-writeoff h2 { font-size: 28px; margin-bottom: 16px; }
  .overlay-writeoff p { font-size: 16px; opacity: 0.85; margin-bottom: 32px; line-height: 1.4; }
  .writeoff-buttons {
    display: flex;
    flex-direction: column;
    gap: 12px;
    width: 100%;
    max-width: 320px;
  }
  .btn-confirm {
    background: #f44336;
    color: #fff;
    border: none;
    padding: 18px;
    font-size: 18px;
    font-weight: 700;
    border-radius: 14px;
    cursor: pointer;
  }
  .btn-cancel {
    background: rgba(255,255,255,0.15);
    color: #fff;
    border: none;
    padding: 18px;
    font-size: 18px;
    font-weight: 600;
    border-radius: 14px;
    cursor: pointer;
  }

  #screen-demo {
    position: absolute;
    inset: 0;
    background: #0f172a;
    padding: 24px;
    overflow-y: auto;
    display: none;
    flex-direction: column;
    z-index: 100;
  }
  #screen-demo.active { display: flex; }
  .demo-header { font-size: 24px; font-weight: 700; margin-bottom: 20px; text-align: center; }
  .demo-list { display: flex; flex-direction: column; gap: 12px; margin-bottom: 24px; flex: 1; overflow-y: auto; }
  .demo-item {
    background: rgba(255,255,255,0.1);
    border-radius: 12px;
    padding: 16px;
    cursor: pointer;
  }
  .demo-item:active { background: rgba(255,255,255,0.2); }
  .demo-status { font-size: 14px; font-weight: 700; margin-bottom: 8px; }
  .demo-code { font-size: 12px; font-family: monospace; opacity: 0.9; word-break: break-all; }
  .btn-back {
    background: rgba(255,255,255,0.2);
    color: #fff;
    border: none;
    padding: 16px;
    font-size: 18px;
    font-weight: 600;
    border-radius: 12px;
    cursor: pointer;
    width: 100%;
  }
</style>
</head>
<body>

<div id="screen-start">
  <div class="start-header">
    <h1>Проверка марок</h1>
    <p>Сканирование DataMatrix · Честный Знак</p>
    <button class="btn-start" id="btn-start">Начать работу</button>
    <button class="btn-demo" id="btn-demo">Показать тестовые коды</button>
  </div>
</div>

<div id="screen-scan">
  <div class="scan-header">
    <button class="btn-scan-back" id="btn-scan-back">← К списку</button>
    <div class="scan-header-title">Наведите камеру на марку</div>
    <div style="width:80px"></div>
  </div>
  <div id="reader">
    <div class="scan-overlay-frame">
      <div class="scan-frame"></div>
    </div>
  </div>

  <div class="overlay" id="overlay-result">
    <div class="overlay-icon" id="ov-icon"></div>
    <div class="overlay-title" id="ov-title"></div>
    <div class="overlay-product" id="ov-product"></div>
    <div class="overlay-stock" id="ov-stock"></div>
    <div class="overlay-subtitle" id="ov-subtitle"></div>
    <div class="overlay-code" id="ov-code"></div>
    <button class="btn-copy" id="btn-copy">📋 Скопировать код</button>
    <button class="btn-action" id="btn-action"></button>
  </div>

  <div class="overlay overlay-writeoff" id="overlay-writeoff">
    <h2>️ Списание товара</h2>
    <p>Подтвердите списание просроченного товара</p>
    <div class="writeoff-buttons">
      <button class="btn-confirm" id="btn-writeoff-confirm">Подтвердить списание</button>
      <button class="btn-cancel" id="btn-writeoff-cancel">Отмена</button>
    </div>
  </div>
</div>

<div id="screen-demo">
  <div class="demo-header">Тестовые коды</div>
  <div class="demo-list" id="demo-list"></div>
  <button class="btn-back" id="btn-demo-back">Назад</button>
</div>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
const MARKS = [
  { km: "04620081141216VX39Rfe", full: "04620081141216VX39RfeAAAAdKhW", status: "ogv_blocked", productName: "ХИТС Бирюзовый DM Стик (ФМ): 10/500", stock: "12 шт." },
  { km: "00000046218636j<St'eH", full: "00000046218636j<St'eHAC3AbwCy", status: "not_in_turnover", productName: "ВОГ СС Блю Сигареты МРЦ172(БАТ):10/500", stock: "5 шт." },
  { km: "00000046218636RCAQXt9", full: "00000046218636RCAQXt9AC3AIK0j", status: "not_in_turnover", productName: "ВОГ СС Блю Сигареты МРЦ172(БАТ):10/500", stock: "3 шт." },
  { km: "00000046209825d_2RRzC", full: "00000046209825d_2RRzCAD=Us7ra", status: "sold", productName: "ВИНСТОН Xsence Серые Сигареты МРЦ253(ДжТи):10/500", stock: "0 шт." },
  { km: "04606203101023V*WyXZM", full: "04606203101023V*WyXZMAC=UCfo9", status: "sold", productName: "НЕКСТ СС Росе Сигареты МРЦ189(ФМ):10/500", stock: "0 шт." },
  { km: "04627146197164r&h0VL&", full: "04627146197164r&h0VL&AAAAyB5Z", status: "expired", productName: "ATTACKER ОЭС Ананас манго маракуйя 800 тяг (МАБАР):10/300", stock: "8 шт." },
  { km: "04660048363510W0YkKvI", full: "04660048363510W0YkKvIAAAAXGHV", status: "expired", productName: "Vuse Про 5000 Клубника Киви Эл Сиг (SST):10/160", stock: "2 шт." }
];

const STATUS_CONFIG = {
  available: { bg: '#16a34a', icon: '✅', title: 'Доступно', subtitle: 'Выставьте в зал', action: 'ОК', voice: 'Товар доступен к продаже', next: 'hide' },
  expired: { bg: '#dc2626', icon: '⛔', title: 'Просрочено', subtitle: 'Проведите списание', action: 'Списать', voice: 'Товар просрочен', next: 'writeoff' },
  written_off: { bg: '#dc2626', icon: '🚫', title: 'Списано ранее', subtitle: 'Утилизируйте товар', action: 'Утилизировать', voice: 'Марка списана ранее', next: 'hide' },
  sold: { bg: '#dc2626', icon: '🚫', title: 'Продано ранее', subtitle: 'Утилизируйте товар', action: 'Утилизировать', voice: 'Марка продана ранее', next: 'hide' },
  not_ours: { bg: '#dc2626', icon: '❌', title: 'Не наша марка', subtitle: 'Утилизируйте товар', action: 'Утилизировать', voice: 'Марка не принадлежит компании', next: 'hide' },
  no_connection: { bg: '#f59e0b', icon: '📡', title: 'Нет связи', subtitle: 'Повторите попытку', action: 'Повторить', voice: 'Нет связи с сервером', next: 'reload' },
  not_in_turnover: { bg: '#0284c7', icon: '📧', title: 'Код не введен в оборот', subtitle: 'Создана заявка в техподдержку', action: 'ОК', voice: 'Код не введен в оборот. Заявка создана', next: 'hide' },
  ogv_blocked: { bg: '#7c3aed', icon: '⏳', title: 'Код заблокирован ОГВ', subtitle: 'Отложите товар', action: 'ОК', voice: 'Код заблокирован ОГВ', next: 'hide' },
  unknown: { bg: '#6b7280', icon: '❓', title: 'Марка не найдена', subtitle: 'Код отсутствует в базе', action: 'ОК', voice: 'Марка не найдена', next: 'hide' }
};

let html5QrCode = null;
let cameraRunning = false;
let lastScannedCode = null;
let lastScanTime = 0;
const COOLDOWN_MS = 2500;

let currentCode = '';
let currentName = '';
let currentStock = '';

function normalizeCode(code) {
  if (!code) return '';
  const t = code.trim();
  return t.length > 21 ? t.substring(0, 21) : t;
}

function lookupStatus(code) {
  const n = code.trim();
  for (const mark of MARKS) {
    if (mark.km === n || mark.full === n || n.startsWith(mark.km) || mark.full.startsWith(n)) {
      return { status: mark.status, productName: mark.productName, stock: mark.stock, km: mark.km };
    }
  }
  return { status: 'unknown', productName: '', stock: '', km: normalizeCode(n) };
}

function speak(text) {
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'ru-RU'; u.rate = 1.05; u.volume = 1;
  const voices = window.speechSynthesis.getVoices();
  const ru = voices.find(v => v.lang.startsWith('ru'));
  if (ru) u.voice = ru;
  window.speechSynthesis.speak(u);
}

function vibrate(pattern) {
  if ('vibrate' in navigator) navigator.vibrate(pattern);
}

function hideAllOverlays() {
  document.querySelectorAll('.overlay').forEach(o => o.classList.remove('active'));
}

function showOverlayResult(config) {
  const ov = document.getElementById('overlay-result');
  ov.style.background = config.bg;
  document.getElementById('ov-icon').textContent = config.icon;
  document.getElementById('ov-title').textContent = config.title;
  document.getElementById('ov-product').textContent = currentName;
  document.getElementById('ov-stock').textContent = currentStock ? `Остаток: ${currentStock}` : '';
  document.getElementById('ov-subtitle').textContent = config.subtitle;
  document.getElementById('ov-code').textContent = currentCode;

  const copyBtn = document.getElementById('btn-copy');
  copyBtn.textContent = '📋 Скопировать код';
  copyBtn.onclick = () => {
    navigator.clipboard.writeText(currentCode).then(() => {
      copyBtn.textContent = '✓ Скопировано';
      setTimeout(() => copyBtn.textContent = '📋 Скопировать код', 1500);
    });
  };

  const btn = document.getElementById('btn-action');
  btn.textContent = config.action;
  btn.onclick = () => handleResultAction(config);

  hideAllOverlays();
  ov.classList.add('active');
  speak(config.voice);
}

function showOverlayWriteoff() {
  hideAllOverlays();
  document.getElementById('overlay-writeoff').classList.add('active');
}

async function startCamera() {
  if (cameraRunning) return;
  
  document.getElementById('screen-start').classList.add('hidden');
  document.getElementById('screen-scan').classList.add('active');
  hideAllOverlays();
  
  try {
    html5QrCode = new Html5Qrcode("reader", { verbose: false });
    await html5QrCode.start(
      { facingMode: "environment" },
      { 
        fps: 15, 
        qrbox: (vw, vh) => ({ 
          width: Math.floor(Math.min(vw, vh) * 0.72), 
          height: Math.floor(Math.min(vw, vh) * 0.72) 
        }), 
        formatsToSupport: [Html5QrcodeSupportedFormats.DATA_MATRIX, Html5QrcodeSupportedFormats.QR_CODE], 
        aspectRatio: 1.0, 
        experimentalFeatures: { useBarCodeDetectorIfAvailable: true } 
      },
      onScanSuccess,
      () => {}
    );
    cameraRunning = true;
  } catch (err) {
    console.error('Ошибка камеры:', err);
    alert('Не удалось запустить камеру: ' + err.message);
  }
}

async function stopCamera() {
  if (!cameraRunning || !html5QrCode) return;
  try {
    await html5QrCode.stop();
    html5QrCode = null;
    cameraRunning = false;
  } catch (e) {
    console.error('Ошибка остановки:', e);
  }
}

async function onScanSuccess(decodedText) {
  const now = Date.now();
  if (decodedText === lastScannedCode && (now - lastScanTime) < COOLDOWN_MS) return;
  lastScannedCode = decodedText;
  lastScanTime = now;
  
  vibrate([80, 50, 80]);

  const markData = lookupStatus(decodedText);
  currentCode = decodedText;
  currentName = markData.productName || '';
  currentStock = markData.stock || '';

  const config = STATUS_CONFIG[markData.status];
  showOverlayResult(config);
}

function handleResultAction(config) {
  if (config.next === 'writeoff') {
    showOverlayWriteoff();
  } else if (config.next === 'reload') {
    window.location.reload();
  } else if (config.next === 'hide') {
    hideAllOverlays();
  }
}

document.getElementById('btn-scan-back').onclick = async () => {
  hideAllOverlays();
  await stopCamera();
  document.getElementById('screen-scan').classList.remove('active');
  document.getElementById('screen-start').classList.remove('hidden');
};

document.getElementById('btn-writeoff-confirm').onclick = () => { 
  vibrate([100, 50, 100, 50, 200]); 
  speak('Списание подтверждено'); 
  hideAllOverlays(); 
};
document.getElementById('btn-writeoff-cancel').onclick = () => hideAllOverlays();

document.getElementById('btn-start').onclick = () => {
  if ('speechSynthesis' in window) {
    window.speechSynthesis.getVoices();
    const w = new SpeechSynthesisUtterance('');
    w.volume = 0;
    window.speechSynthesis.speak(w);
  }
  startCamera();
};

function showDemoCodes() {
  const list = document.getElementById('demo-list');
  list.innerHTML = '';
  const labels = { 
    available: '🟢 Доступно', expired: '🔴 Просрочено', written_off: '🔴 Списано ранее', 
    sold: '🔴 Продано ранее', not_ours: '🔴 Не наша марка', no_connection: '🟡 Нет связи', 
    not_in_turnover: '🔵 Не введен в оборот', ogv_blocked: '🟣 Заблокирован ОГВ' 
  };
  for (const mark of MARKS) {
    const item = document.createElement('div');
    item.className = 'demo-item';
    item.innerHTML = `<div class="demo-status">${labels[mark.status]}</div><div class="demo-code" style="margin-bottom:4px">КМ: ${mark.km}</div><div style="font-size:11px;opacity:0.7">${mark.productName} · ${mark.stock}</div>`;
    item.onclick = () => {
      navigator.clipboard.writeText(mark.km).then(() => {
        const el = item.querySelector('.demo-status');
        const orig = el.textContent;
        el.textContent = '✓ Скопирован';
        setTimeout(() => el.textContent = orig, 1000);
      });
    };
    list.appendChild(item);
  }
  document.getElementById('screen-demo').classList.add('active');
}

document.getElementById('btn-demo').onclick = showDemoCodes;
document.getElementById('btn-demo-back').onclick = () => {
  document.getElementById('screen-demo').classList.remove('active');
};

if ('speechSynthesis' in window) {
  window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
}
</script>
</body>
</html>
