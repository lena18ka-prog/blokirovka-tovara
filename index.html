<html lang="ru">

<title>Проверка марок · Честный Знак</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #1a1a1a;
    color: #fff;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
  }
  .screen {
    position: absolute;
    inset: 0;
    display: none;
    flex-direction: column;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .screen.active { display: flex; }

  #screen-start {
    background: #1a1a1a;
    overflow-y: auto;
  }

    background: linear-gradient(135deg, #1e3a8a, #3b82f6);

  }
  .start-header h1 { font-size: 28px; margin-bottom: 8px; }
  .start-header p { font-size: 14px; opacity: 0.9; }
  .btn-start {
    background: #fff;
    color: #1e3a8a;
    border: none;
    padding: 18px 40px;
    font-size: 18px;
    font-weight: 700;
    border-radius: 16px;
    cursor: pointer;
    box-shadow: 0 8px 24px rgba(0,0,0,0.25);
    margin-top: 16px;
    width: 100%;
    max-width: 320px;
  }
  .btn-start:active { transform: scale(0.97); }
  .btn-demo {
    background: rgba(255,255,255,0.2);
    color: #fff;
    border: 2px solid rgba(255,255,255,0.5);
    padding: 14px 32px;
    font-size: 16px;
    font-weight: 600;
    border-radius: 12px;
    cursor: pointer;
    margin-top: 12px;
    width: 100%;
    max-width: 320px;
  }
  .btn-demo:active { transform: scale(0.97); }
  
  .pending-section {
    padding: 20px;
    flex: 1;
  }
  .pending-header {
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .pending-count {
    background: #f59e0b;
    color: #000;
    padding: 2px 8px;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 700;
  }
  .pending-list {
    display: flex;
    flex-direction: column;
    gap: 10px;

    overflow-y: auto;
  }
  .pending-item {
    background: rgba(255,255,255,0.08);
    border-radius: 12px;
    padding: 14px;
    border-left: 4px solid;

  .pending-item.ogv { border-left-color: #7c3aed; }
  .pending-status {
    font-size: 12px;
    font-weight: 700;
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .pending-product {
    font-size: 14px;
    margin-bottom: 4px;
    line-height: 1.3;
  }
  .pending-time {
    font-size: 11px;
    opacity: 0.7;
  }
  .pending-empty {
    text-align: center;
    padding: 40px 20px;
    opacity: 0.5;
    font-size: 14px;
  }

  #screen-demo {
    background: #0f172a;
    padding: 24px;
    overflow-y: auto;
  }
  .demo-header {
    font-size: 24px;
    font-weight: 700;
    margin-bottom: 20px;
    text-align: center;
  }
  .demo-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 24px;
  }
  .demo-item {
    background: rgba(255,255,255,0.1);
    border-radius: 12px;
    padding: 16px;
    cursor: pointer;

  .demo-item:active { background: rgba(255,255,255,0.2); }

    font-size: 14px;
    font-weight: 700;
    margin-bottom: 8px;
  }
  .demo-code {

    opacity: 0.9;

  .btn-back {
    background: rgba(255,255,255,0.2);
    color: #fff;
    border: none;
    padding: 16px;
    font-size: 18px;
    font-weight: 600;
    border-radius: 12px;
    cursor: pointer;
    width: 100%;
  }

  #screen-scan { background: #000; }
  .scan-header {
    padding: 16px 20px;
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    text-align: center;
    font-size: 17px;
    font-weight: 600;
    z-index: 10;
  }
  #reader { flex: 1; position: relative; overflow: hidden; }
  #reader video {
    width: 100% !important;
    height: 100% !important;
    object-fit: cover !important;
  }
  #reader__scan_region { width: 100%; height: 100%; }
  #reader__scan_region video { width: 100% !important; height: 100% !important; }
  #reader__dashboard { display: none !important; }
  .scan-overlay {
    position: absolute;
    inset: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    pointer-events: none;
    z-index: 5;
  }
  .scan-frame {
    width: min(75vw, 320px);
    height: min(75vw, 320px);
    border: 3px solid rgba(255,255,255,0.9);
    border-radius: 20px;
    box-shadow: 0 0 0 9999px rgba(0,0,0,0.45);
    position: relative;
  }
  .scan-frame::before {
    content: "Наведите камеру на марку";
    position: absolute;
    bottom: -40px;
    left: 50%;
    transform: translateX(-50%);
    color: #fff;
    font-size: 14px;
    white-space: nowrap;
    text-shadow: 0 2px 4px rgba(0,0,0,0.8);
  }
  .scan-loader {
    position: absolute;
    inset: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    background: rgba(0,0,0,0.8);
    color: #fff;
    font-size: 16px;
    z-index: 20;
  }
  .scan-loader.hidden { display: none; }
  .spinner {
    width: 32px;
    height: 32px;
    border: 3px solid rgba(255,255,255,0.3);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin-right: 12px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .scan-error {
    text-align: center;
    padding: 20px;
    color: #f87171;
  }
  .scan-error button {
    margin-top: 16px;
    background: rgba(255,255,255,0.2);
    color: #fff;
    border: none;
    padding: 12px 24px;
    font-size: 16px;
    border-radius: 10px;
    cursor: pointer;
  }

  #screen-result {
    justify-content: center;
    align-items: center;
    padding: 24px 20px;
    text-align: center;
    transition: background 0.3s;
  }
  .result-icon {
    font-size: 70px;
    margin-bottom: 16px;
    animation: pop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  @keyframes pop {
    0% { transform: scale(0); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }
  .result-title {
    font-size: 28px;
    font-weight: 800;
    margin-bottom: 8px;
    line-height: 1.1;
  }
  .result-product {
    font-size: 16px;
    margin-bottom: 8px;
    opacity: 0.95;
    line-height: 1.3;
    max-width: 100%;
    padding: 0 12px;

  .result-stock {
    font-size: 14px;
    margin-bottom: 12px;
    opacity: 0.9;
  }
  .result-subtitle {
    font-size: 18px;
    margin-bottom: 20px;
    opacity: 0.95;
    line-height: 1.3;
  }
  .result-code {
    font-size: 11px;
    opacity: 0.7;
    margin-bottom: 12px;
    word-break: break-all;
    max-width: 100%;
    font-family: monospace;
    padding: 0 12px;

  .btn-copy {

    font-size: 14px;
    font-weight: 600;
    border-radius: 10px;
    cursor: pointer;
    margin-bottom: 20px;

  .btn-copy.copied {

  .btn-action {
    background: rgba(255,255,255,0.95);
    color: #1a1a1a;
    border: none;
    padding: 18px 40px;
    font-size: 18px;
    font-weight: 700;
    border-radius: 16px;
    cursor: pointer;

    padding: 0;

    from { transform: translateY(-100%); }
    to { transform: translateY(0); }

  .notification-icon {
    font-size: 32px;

  .notification-content {
    flex: 1;

  .notification-title {
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 4px;
  }
  .notification-text {
    font-size: 14px;
    opacity: 0.9;
    line-height: 1.3;
  }
  .notification-body {
    padding: 24px 20px;
    flex: 1;
    overflow-y: auto;

    background: rgba(255,255,255,0.1);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 12px;
  }
  .notification-product-name {
    font-size: 16px;
    font-weight: 600;
    margin-bottom: 8px;
  }
  .notification-product-status {
    font-size: 14px;
    opacity: 0.9;
  }
  .btn-notification-close {
    background: rgba(255,255,255,0.2);
    color: #fff;
    border: none;
    padding: 18px;
    font-size: 18px;
    font-weight: 600;
    border-radius: 14px;
    cursor: pointer;
    margin: 20px;
  }
</style>
</head>
<body>

<div id="screen-start" class="screen active">
  <div class="start-header">
    <h1>Проверка марок</h1>

  </div>
  <div class="pending-section">

</div>

<div id="screen-demo" class="screen">

</div>

  <div class="result-subtitle" id="result-subtitle"></div>

  <button class="btn-copy" id="btn-copy">📋 Скопировать код</button>
  <button class="btn-action" id="btn-action"></button>
</div>

<div id="screen-writeoff" class="screen">
  <h2>⚠️ Списание товара</h2>

    <button class="btn-cancel" id="btn-writeoff-cancel">Отмена</button>
  </div>
</div>

<div id="screen-notification" class="screen">
  <div class="notification-banner">
    <div class="notification-icon"></div>
    <div class="notification-content">
      <div class="notification-title">Уведомление</div>
      <div class="notification-text">Проверьте товары</div>
    </div>
  </div>
  <div class="notification-body" id="notification-body"></div>
  <button class="btn-notification-close" id="btn-notification-close">Закрыть</button>
</div>

// Хранилище ожидающих товаров
let pendingItems = JSON.parse(localStorage.getItem('pendingMarks') || '[]');

let html5QrCode = null;
let isScanning = false;
let lastScannedCode = null;
let lastScanTime = 0;
const COOLDOWN_MS = 2500;
let currentResultCode = '';
let currentProductName = '';
let currentStock = '';

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  
  if (id === 'screen-start') {
    updatePendingList();
  }
}

function updatePendingList() {
  const list = document.getElementById('pending-list');
  const count = document.getElementById('pending-count');
  
  count.textContent = pendingItems.length;
  
  if (pendingItems.length === 0) {
    list.innerHTML = '<div class="pending-empty">Нет товаров, ожидающих решения</div>';
    return;
  }
  
  list.innerHTML = '';
  pendingItems.forEach(item => {
    const div = document.createElement('div');
    div.className = `pending-item ${item.type}`;
    const statusText = item.type === 'help' ? ' Заявка в хелп' : ' Заблокирован ОГВ';
    const time = new Date(item.timestamp).toLocaleString('ru-RU', {
      day: '2-digit',
      month: '2-digit',
      hour: '2-digit',
      minute: '2-digit'
    });
    div.innerHTML = `
      <div class="pending-status">${statusText}</div>
      <div class="pending-product">${item.productName}</div>
      <div class="pending-time">${time}</div>
    `;
    list.appendChild(div);
  });
}

function showDemoCodes() {
  const list = document.getElementById('demo-list');
  list.innerHTML = '';
  const statusLabels = {
    available: '🟢 Доступно', 
    expired: '🔴 Просрочено', 
    written_off: '🔴 Списано ранее',
    sold: '🔴 Продано ранее', 
    not_ours: '🔴 Не наша марка', 
    no_connection: ' Нет связи',
    not_in_turnover: '🔵 Не введен в оборот',
    ogv_blocked: '🟣 Заблокирован ОГВ'
  };
  
  for (const mark of MARKS) {
    const item = document.createElement('div');
    item.className = 'demo-item';
    item.innerHTML = `
      <div class="demo-status">${statusLabels[mark.status]}</div>
      <div class="demo-code" style="margin-bottom:4px">КМ: ${mark.km}</div>
      <div style="font-size:11px;opacity:0.7">${mark.productName} · ${mark.stock}</div>
    `;
    item.onclick = () => {
      navigator.clipboard.writeText(mark.km).then(() => {
        const el = item.querySelector('.demo-status');
        const orig = el.textContent;
        el.textContent = '✓ КМ скопирован';
        setTimeout(() => el.textContent = orig, 1000);
      });
    };
    list.appendChild(item);
  }
  showScreen('screen-demo');
}

      console.log('Найдено:', mark.km);
      return { 
        status: mark.status, 
        productName: mark.productName,
        stock: mark.stock
      };
    }
    if (normalized.startsWith(mark.km) || mark.full.startsWith(normalized)) {
      console.log('Найдено по префиксу:', mark.km);
      return { 
        status: mark.status, 
        productName: mark.productName,
        stock: mark.stock
      };
    }
  }
  
  console.log('Не найдено в базе');
  return { status: 'unknown', productName: '', stock: '' };
}

function speak(text) {
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'ru-RU'; u.rate = 1.05; u.volume = 1;
  const voices = window.speechSynthesis.getVoices();
  const ru = voices.find(v => v.lang.startsWith('ru'));
  if (ru) u.voice = ru;
  window.speechSynthesis.speak(u);
}

function vibrate(pattern) {
  if ('vibrate' in navigator) navigator.vibrate(pattern);
}

async function resetScanner() {
  if (html5QrCode) {
    try {
      if (isScanning) {
        await html5QrCode.stop();
      }
      const reader = document.getElementById('reader');
      while (reader.firstChild) {
        reader.removeChild(reader.firstChild);
      }
      reader.innerHTML = `
        <div class="scan-overlay">
          <div class="scan-frame"></div>
        </div>
        <div class="scan-loader" id="scan-loader">
          <div class="spinner"></div>
          <span>Запуск камеры...</span>
        </div>
      `;
    } catch (e) {
      console.error('Ошибка при сбросе сканера:', e);
    }
    html5QrCode = null;
  }
  isScanning = false;
}

async function startScanner() {
  if (isScanning) return;
  
  showScreen('screen-scan');
  const loader = document.getElementById('scan-loader');
  if (loader) {
    loader.classList.remove('hidden');
    loader.innerHTML = '<div class="spinner"></div><span>Запуск камеры...</span>';
  }

  try {
    html5QrCode = new Html5Qrcode("reader", { verbose: false });

    await html5QrCode.start(
      { facingMode: "environment" },
      {
        fps: 15,
        qrbox: (vw, vh) => {
          const size = Math.floor(Math.min(vw, vh) * 0.72);
          return { width: size, height: size };
        },
        formatsToSupport: [
          Html5QrcodeSupportedFormats.DATA_MATRIX,
          Html5QrcodeSupportedFormats.QR_CODE
        ],
        aspectRatio: 1.0,
        experimentalFeatures: { useBarCodeDetectorIfAvailable: true }
      },
      onScanSuccess,
      onScanFailure
    );

    isScanning = true;
    const loaderEl = document.getElementById('scan-loader');
    if (loaderEl) loaderEl.classList.add('hidden');
  } catch (err) {
    console.error('Ошибка запуска камеры:', err);
    const loaderEl = document.getElementById('scan-loader');
    if (loaderEl) {
      loaderEl.innerHTML = `
        <div class="scan-error">
          <div style="font-size:48px;margin-bottom:12px">📷</div>
          <div>Не удалось запустить камеру</div>
          <div style="font-size:14px;opacity:0.7;margin-top:8px">${err.message}</div>
          <button onclick="resetAndStart()">Повторить</button>
        </div>
      `;
    }
  }
}

async function resetAndStart() {
  await resetScanner();
  setTimeout(() => startScanner(), 300);
}

function onScanFailure(error) {}

async function stopScanner() {
  if (html5QrCode && isScanning) {
    try {
      await html5QrCode.stop();
    } catch (e) {
      console.error('Ошибка остановки:', e);
    }
  }
  isScanning = false;
}

async function onScanSuccess(decodedText) {
  const now = Date.now();
  if (decodedText === lastScannedCode && (now - lastScanTime) < COOLDOWN_MS) return;
  lastScannedCode = decodedText;
  lastScanTime = now;

  vibrate([80, 50, 80]);
  await stopScanner();

  const markData = lookupStatus(decodedText);
  const config = STATUS_CONFIG[markData.status];
  currentResultCode = decodedText;
  currentProductName = markData.productName || '';
  currentStock = markData.stock || '';
  
  // Проверяем, есть ли уже в pending
  const existingPending = pendingItems.find(p => p.code === decodedText);
  
  if (existingPending && (markData.status === 'not_in_turnover' || markData.status === 'ogv_blocked')) {
    // Повторное сканирование - заявка уже в работе
    showPendingNotification(markData, existingPending);
  } else {
    showResult(config, decodedText);
    speak(config.voice);
  }
}

function showPendingNotification(markData, pendingItem) {
  const type = markData.status === 'not_in_turnover' ? 'help' : 'ogv';
  const message = type === 'help' 
    ? 'Заявка уже в работе. Ждите уведомление.' 
    : 'Товар уже отложен. Ждите уведомление.';
  
  document.getElementById('screen-result').style.background = '#6b7280';
  document.getElementById('result-icon').textContent = '⏳';
  document.getElementById('result-title').textContent = 'Уже в работе';
  document.getElementById('result-product').textContent = markData.productName;
  document.getElementById('result-stock').textContent = markData.stock;
  document.getElementById('result-subtitle').textContent = message;
  document.getElementById('result-code').textContent = currentResultCode;
  
  const copyBtn = document.getElementById('btn-copy');
  copyBtn.textContent = ' Скопировать код';
  copyBtn.classList.remove('copied');
  copyBtn.onclick = () => {
    navigator.clipboard.writeText(currentResultCode).then(() => {
      copyBtn.textContent = '✓ Скопировано';
      copyBtn.classList.add('copied');
      setTimeout(() => {
        copyBtn.textContent = '📋 Скопировать код';
        copyBtn.classList.remove('copied');
      }, 1500);
    });
  };

  const btn = document.getElementById('btn-action');
  btn.textContent = 'ОК';
  btn.onclick = () => resetAndStart();

  showScreen('screen-result');
  speak(message);
}

function showResult(config, code) {
  document.getElementById('screen-result').style.background = config.bg;
  document.getElementById('result-icon').textContent = config.icon;
  document.getElementById('result-title').textContent = config.title;
  document.getElementById('result-product').textContent = currentProductName;
  document.getElementById('result-stock').textContent = currentStock ? `Остаток: ${currentStock}` : '';
  document.getElementById('result-subtitle').textContent = config.subtitle;
  document.getElementById('result-code').textContent = code;
  
  const copyBtn = document.getElementById('btn-copy');
  copyBtn.textContent = '📋 Скопировать код';
  copyBtn.classList.remove('copied');
  copyBtn.onclick = () => {
    navigator.clipboard.writeText(code).then(() => {
      copyBtn.textContent = '✓ Скопировано';
      copyBtn.classList.add('copied');
      setTimeout(() => {
        copyBtn.textContent = ' Скопировать код';
        copyBtn.classList.remove('copied');
      }, 1500);
    });
  };

  const btn = document.getElementById('btn-action');
  btn.textContent = config.action;
  btn.onclick = () => handleAction(config);

  showScreen('screen-result');
}

function handleAction(config) {
  if (config.next === 'writeoff') {
    showScreen('screen-writeoff');
  } else if (config.next === 'auto_help') {
    // Автоматическое создание заявки
    addToPending('help', currentProductName, currentResultCode);
    showQuickNotification('Заявка создана', 'Товар добавлен в список ожидания');
    setTimeout(() => resetAndStart(), 1500);
  } else if (config.next === 'auto_ogv') {
    // Автоматическое добавление в отложенные
    addToPending('ogv', currentProductName, currentResultCode);
    showQuickNotification('Товар отложен', 'Ждите уведомления об изменении статуса');
    setTimeout(() => resetAndStart(), 1500);
  } else if (config.next === 'reload') {
    window.location.reload();
  } else if (config.next === 'scan') {
    resetAndStart();
  }
}

function addToPending(type, productName, code) {
  const item = {
    type: type,
    productName: productName,
    code: code,
    timestamp: Date.now()
  };
  pendingItems.push(item);
  localStorage.setItem('pendingMarks', JSON.stringify(pendingItems));
}

function showQuickNotification(title, text) {
  // Показываем короткое уведомление перед возвратом к скану
  const notification = document.createElement('div');
  notification.style.cssText = `
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: #1e3a8a;
    color: #fff;
    padding: 16px 24px;
    border-radius: 12px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    z-index: 1000;
    animation: slideDown 0.3s ease-out;
    max-width: 90%;
    text-align: center;
  `;
  notification.innerHTML = `
    <div style="font-weight: 700; margin-bottom: 4px;">${title}</div>
    <div style="font-size: 14px; opacity: 0.9;">${text}</div>
  `;
  document.body.appendChild(notification);
  
  setTimeout(() => {
    notification.style.opacity = '0';
    notification.style.transition = 'opacity 0.3s';
    setTimeout(() => notification.remove(), 300);
  }, 1200);
}

function showNotificationScreen() {
  // Имитация пуш-уведомления - берем случайный товар из pending
  if (pendingItems.length === 0) return;
  
  const randomIndex = Math.floor(Math.random() * pendingItems.length);
  const item = pendingItems[randomIndex];
  
  const body = document.getElementById('notification-body');
  body.innerHTML = `
    <div class="notification-product">
      <div class="notification-product-name">${item.productName}</div>
      <div class="notification-product-status">
        ${item.type === 'help' ? '✅ Заявка обработана. Проверьте товар.' : '✅ Статус изменен. Можно продолжить работу.'}
      </div>
    </div>
  `;
  
  showScreen('screen-notification');
  vibrate([200, 100, 200]);
}

document.getElementById('btn-writeoff-confirm').onclick = () => {
  vibrate([100, 50, 100, 50, 200]);
  speak('Списание подтверждено');
  resetAndStart();
};

document.getElementById('btn-writeoff-cancel').onclick = () => {
  resetAndStart();
};

document.getElementById('btn-notification-close').onclick = () => {
  // Удаляем товар из pending после просмотра уведомления
  if (pendingItems.length > 0) {
    pendingItems.shift();
    localStorage.setItem('pendingMarks', JSON.stringify(pendingItems));
  }
  showScreen('screen-start');
};

document.getElementById('btn-start').onclick = () => {
  if ('speechSynthesis' in window) {
    window.speechSynthesis.getVoices();
    const w = new SpeechSynthesisUtterance('');
    w.volume = 0;
    window.speechSynthesis.speak(w);
  }
  startScanner();
};

document.getElementById('btn-demo').onclick = showDemoCodes;
document.getElementById('btn-demo-back').onclick = () => showScreen('screen-start');

if ('speechSynthesis' in window) {
  window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
}

// Имитация пуш-уведомления через 30 секунд после запуска (для демо)
setTimeout(() => {
  if (pendingItems.length > 0 && Math.random() > 0.5) {
    showNotificationScreen();
  }
}, 30000);

// Обновляем список при загрузке
updatePendingList();
</script>
