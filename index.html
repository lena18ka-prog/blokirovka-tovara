<head>

<title>Проверка марок · Честный Знак</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #000;
    color: #fff;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
  }
  
  #screen-start {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    background: #1a1a1a;
    overflow-y: auto;

  }
  #screen-start.hidden { display: none; }
  .start-header {
    background: linear-gradient(135deg, #1e3a8a, #3b82f6);

  .btn-start {

  .btn-clear {

  #screen-scan {

    inset: 0;
    background: #000;
    display: none;
    flex-direction: column;
  }

  .scan-header {

    background: rgba(0,0,0,0.75);

    height: 100% !important;

  }

  #reader__scan_region video { width: 100% !important; height: 100% !important; }

  .scan-overlay-frame {
    position: absolute;
    inset: 0;
    display: flex;

    align-items: center;
    pointer-events: none;

  .scan-frame {

  .overlay {
    position: absolute;

  .notification-product-status { font-size: 14px; opacity: 0.9; }
  .btn-notification-close {
    background: rgba(255,255,255,0.2);

    border: none;
    padding: 18px;
    font-size: 18px;
    font-weight: 600;
    border-radius: 14px;
    cursor: pointer;
    margin: 20px;

  #screen-demo {
    position: absolute;
    inset: 0;
    background: #0f172a;
    padding: 24px;
    overflow-y: auto;
    display: none;
    flex-direction: column;
    z-index: 100;

  #screen-demo.active { display: flex; }
  .demo-header { font-size: 24px; font-weight: 700; margin-bottom: 20px; text-align: center; }
  .demo-list { display: flex; flex-direction: column; gap: 12px; margin-bottom: 24px; flex: 1; overflow-y: auto; }
  .demo-item {
    background: rgba(255,255,255,0.1);
    border-radius: 12px;
    padding: 16px;
    cursor: pointer;
  }
  .demo-item:active { background: rgba(255,255,255,0.2); }
  .demo-status { font-size: 14px; font-weight: 700; margin-bottom: 8px; }
  .demo-code { font-size: 12px; font-family: monospace; opacity: 0.9; word-break: break-all; }
  .btn-back {
    background: rgba(255,255,255,0.2);
    color: #fff;
    border: none;
    padding: 16px;
    font-size: 18px;
    font-weight: 600;
    border-radius: 12px;
    cursor: pointer;
    width: 100%;
  }

  .toast {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: #1e3a8a;
    color: #fff;
    padding: 16px 24px;
    border-radius: 12px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    z-index: 3000;
    max-width: 90%;
    text-align: center;
    animation: slideDown 0.3s ease-out;
  }
  @keyframes slideDown {
    from { transform: translate(-50%, -100%); }
    to { transform: translate(-50%, 0); }
  }
</style>
</head>
<body>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
const MARKS = [
  { km: "04620081141216VX39Rfe", full: "04620081141216VX39RfeAAAAdKhW", status: "ogv_blocked", productName: "ХИТС Бирюзовый DM Стик (ФМ): 10/500", stock: "12 шт." },
  { km: "00000046218636j<St'eH", full: "00000046218636j<St'eHAC3AbwCy", status: "not_in_turnover", productName: "ВОГ СС Блю Сигареты МРЦ172(БАТ):10/500", stock: "5 шт." },
  { km: "00000046218636RCAQXt9", full: "00000046218636RCAQXt9AC3AIK0j", status: "not_in_turnover", productName: "ВОГ СС Блю Сигареты МРЦ172(БАТ):10/500", stock: "3 шт." },
  { km: "00000046209825d_2RRzC", full: "00000046209825d_2RRzCAD=Us7ra", status: "sold", productName: "ВИНСТОН Xsence Серые Сигареты МРЦ253(ДжТи):10/500", stock: "0 шт." },
  { km: "04606203101023V*WyXZM", full: "04606203101023V*WyXZMAC=UCfo9", status: "sold", productName: "НЕКСТ СС Росе Сигареты МРЦ189(ФМ):10/500", stock: "0 шт." },
  { km: "04627146197164r&h0VL&", full: "04627146197164r&h0VL&AAAAyB5Z", status: "expired", productName: "ATTACKER ОЭС Ананас манго маракуйя 800 тяг (МАБАР):10/300", stock: "8 шт." },
  { km: "04660048363510W0YkKvI", full: "04660048363510W0YkKvIAAAAXGHV", status: "expired", productName: "Vuse Про 5000 Клубника Киви Эл Сиг (SST):10/160", stock: "2 шт." }
];

const STATUS_CONFIG = {
  available: { bg: '#16a34a', icon: '✅', title: 'Доступно', subtitle: 'Выставьте в зал', action: 'ОК', voice: 'Товар доступен к продаже', next: 'hide' },
  // ИЗМЕНЕНО: было 'writeoff', стало 'writeoff_auto' — без второго экрана
  expired: { bg: '#dc2626', icon: '', title: 'Просрочено', subtitle: 'Проведите списание', action: 'Списать', voice: 'Товар просрочен', next: 'writeoff_auto' },
  written_off: { bg: '#dc2626', icon: '🚫', title: 'Списано ранее', subtitle: 'Утилизируйте товар', action: 'Утилизировать', voice: 'Марка списана ранее', next: 'hide' },
  sold: { bg: '#dc2626', icon: '🚫', title: 'Продано ранее', subtitle: 'Утилизируйте товар', action: 'Утилизировать', voice: 'Марка продана ранее', next: 'hide' },
  not_ours: { bg: '#dc2626', icon: '❌', title: 'Не наша марка', subtitle: 'Утилизируйте товар', action: 'Утилизировать', voice: 'Марка не принадлежит компании', next: 'hide' },
  no_connection: { bg: '#f59e0b', icon: '📡', title: 'Нет связи', subtitle: 'Повторите попытку', action: 'Повторить', voice: 'Нет связи с сервером', next: 'reload' },
  not_in_turnover: { bg: '#0284c7', icon: '📧', title: 'Код не введен в оборот', subtitle: 'Требуется заявка', action: 'В хелп', voice: 'Код не введен в оборот', next: 'add_pending' },
  ogv_blocked: { bg: '#7c3aed', icon: '⏳', title: 'Код заблокирован ОГВ', subtitle: 'Отложите товар', action: 'Отложить', voice: 'Код заблокирован ОГВ', next: 'add_pending' },
  unknown: { bg: '#6b7280', icon: '❓', title: 'Марка не найдена', subtitle: 'Код отсутствует в базе', action: 'ОК', voice: 'Марка не найдена', next: 'hide' }
};

let pendingItems = JSON.parse(localStorage.getItem('pendingMarks') || '[]');
let html5QrCode = null;
let cameraRunning = false;
let lastScannedCode = null;
let lastScanTime = 0;
const COOLDOWN_MS = 2500;

let currentCode = '';
let currentKm = '';
let currentName = '';
let currentStock = '';
let currentStatus = '';

let pushCheckInterval = null;
const PUSH_DELAY_MS = 20000;

function normalizeCode(code) {
  if (!code) return '';
  const t = code.trim();
  return t.length > 21 ? t.substring(0, 21) : t;
}

function lookupStatus(code) {
  const n = code.trim();
  for (const mark of MARKS) {
    if (mark.km === n || mark.full === n || n.startsWith(mark.km) || mark.full.startsWith(n)) {
      return { status: mark.status, productName: mark.productName, stock: mark.stock, km: mark.km };
    }
  }
  return { status: 'unknown', productName: '', stock: '', km: normalizeCode(n) };
}

function speak(text) {
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'ru-RU'; u.rate = 1.05; u.volume = 1;
  const voices = window.speechSynthesis.getVoices();
  const ru = voices.find(v => v.lang.startsWith('ru'));
  if (ru) u.voice = ru;
  window.speechSynthesis.speak(u);
}

function vibrate(pattern) {
  if ('vibrate' in navigator) navigator.vibrate(pattern);
}

function showToast(title, text) {
  const existing = document.querySelector('.toast');
  if (existing) existing.remove();
  const toast = document.createElement('div');
  toast.className = 'toast';
  toast.innerHTML = `<div style="font-weight:700;margin-bottom:4px">${title}</div><div style="font-size:14px;opacity:0.9">${text}</div>`;
  document.body.appendChild(toast);
  setTimeout(() => {
    toast.style.opacity = '0';
    toast.style.transition = 'opacity 0.3s';
    setTimeout(() => toast.remove(), 300);
  }, 2000);
}

function hideAllOverlays() {
  document.querySelectorAll('.overlay').forEach(o => o.classList.remove('active'));
}

function showOverlayResult(config) {
  const ov = document.getElementById('overlay-result');
  ov.style.background = config.bg;
  document.getElementById('ov-icon').textContent = config.icon;
  document.getElementById('ov-title').textContent = config.title;
  document.getElementById('ov-product').textContent = currentName;
  document.getElementById('ov-stock').textContent = currentStock ? `Остаток: ${currentStock}` : '';
  document.getElementById('ov-subtitle').textContent = config.subtitle;
  document.getElementById('ov-code').textContent = currentCode;

  const copyBtn = document.getElementById('btn-copy');
  copyBtn.textContent = '📋 Скопировать код';
  copyBtn.onclick = () => {
    navigator.clipboard.writeText(currentCode).then(() => {
      copyBtn.textContent = '✓ Скопировано';
      setTimeout(() => copyBtn.textContent = '📋 Скопировать код', 1500);
    });
  };

  const btn = document.getElementById('btn-action');
  btn.textContent = config.action;
  btn.onclick = () => handleResultAction(config);

  hideAllOverlays();
  ov.classList.add('active');
  speak(config.voice);
}

function showOverlayNotification(item) {
  const body = document.getElementById('notification-body');
  const msg = item.type === 'help' 
    ? '✅ Заявка обработана. Отсканируйте марку — статус изменится на «Выставьте в торговый зал».' 
    : '✅ Статус марки изменён. Отсканируйте марку — статус изменится на «Выставьте в торговый зал».';
  body.innerHTML = `
    <div class="notification-product">
      <div class="notification-product-name">${item.productName}</div>
      <div class="notification-product-status">${msg}</div>
      <div style="font-size:12px;opacity:0.7;margin-top:8px">КМ: ${item.normalizedCode}</div>
    </div>
  `;
  hideAllOverlays();
  document.getElementById('overlay-notification').classList.add('active');
  vibrate([200, 100, 200, 100, 300]);
  speak('Уведомление. ' + item.productName);
}

async function startCamera() {
  if (cameraRunning) return;
  
  document.getElementById('screen-start').classList.add('hidden');
  document.getElementById('screen-scan').classList.add('active');
  hideAllOverlays();
  
  try {
    html5QrCode = new Html5Qrcode("reader", { verbose: false });
    await html5QrCode.start(
      { facingMode: "environment" },
      { 
        fps: 15, 
        qrbox: (vw, vh) => ({ 
          width: Math.floor(Math.min(vw, vh) * 0.72), 
          height: Math.floor(Math.min(vw, vh) * 0.72) 
        }), 
        formatsToSupport: [Html5QrcodeSupportedFormats.DATA_MATRIX, Html5QrcodeSupportedFormats.QR_CODE], 
        aspectRatio: 1.0, 
        experimentalFeatures: { useBarCodeDetectorIfAvailable: true } 
      },
      onScanSuccess,
      () => {}
    );
    cameraRunning = true;
  } catch (err) {
    console.error('Ошибка камеры:', err);
    alert('Не удалось запустить камеру: ' + err.message);
  }
}

async function stopCamera() {
  if (!cameraRunning || !html5QrCode) return;
  try {
    await html5QrCode.stop();
    html5QrCode = null;
    cameraRunning = false;
  } catch (e) {
    console.error('Ошибка остановки:', e);
  }
}

async function onScanSuccess(decodedText) {
  const now = Date.now();
  if (decodedText === lastScannedCode && (now - lastScanTime) < COOLDOWN_MS) return;
  lastScannedCode = decodedText;
  lastScanTime = now;
  
  vibrate([80, 50, 80]);

  const markData = lookupStatus(decodedText);
  currentCode = decodedText;
  currentKm = markData.km || normalizeCode(decodedText);
  currentName = markData.productName || '';
  currentStock = markData.stock || '';
  currentStatus = markData.status;

  const pendingItem = findPendingByCode(currentKm);

  if (pendingItem) {
    if (pendingItem.step === 'waiting') {
      showOverlayResult({ 
        bg: '#6b7280', icon: '⏳', title: 'Задание в работе', 
        subtitle: 'Ждите уведомления', action: 'ОК', voice: 'Задание уже в работе', next: 'hide' 
      });
    } else if (pendingItem.step === 'notified') {
      showOverlayResult({ 
        bg: '#16a34a', icon: '✅', title: 'Выставьте в торговый зал', 
        subtitle: 'Товар готов к продаже', action: 'Выставлено', voice: 'Выставьте товар в зал', next: 'remove_pending' 
      });
    }
  } else {
    const config = STATUS_CONFIG[markData.status];
    showOverlayResult(config);
  }
}

// ИЗМЕНЕНО: обработка writeoff_auto — без второго экрана
function handleResultAction(config) {
  if (config.next === 'writeoff_auto') {
    // Автоматическое списание без подтверждения
    vibrate([100, 50, 100, 50, 200]);
    speak('Списание подтверждено');
    showToast('✅ Списание подтверждено', '');
    hideAllOverlays();
  } else if (config.next === 'add_pending') {
    const type = currentStatus === 'ogv_blocked' ? 'ogv' : 'help';
    const existing = findPendingByCode(currentKm);
    if (!existing) {
      pendingItems.push({ 
        type, productName: currentName, code: currentCode, 
        normalizedCode: currentKm, timestamp: Date.now(), step: 'waiting' 
      });
      localStorage.setItem('pendingMarks', JSON.stringify(pendingItems));
    }
    showToast(type === 'ogv' ? '⏳ Товар отложен' : ' Заявка создана', 'Пуш через 20 сек');
    hideAllOverlays();
  } else if (config.next === 'remove_pending') {
    removePendingByCode(currentKm);
    showToast('✅ Товар выставлен в зал', 'Задание выполнено');
    speak('Товар выставлен в торговый зал');
    hideAllOverlays();
  } else if (config.next === 'reload') {
    window.location.reload();
  } else if (config.next === 'hide') {
    hideAllOverlays();
  }
}

function findPendingByCode(km) {
  return pendingItems.find(p => p.normalizedCode === km);
}

function removePendingByCode(km) {
  pendingItems = pendingItems.filter(p => p.normalizedCode !== km);
  localStorage.setItem('pendingMarks', JSON.stringify(pendingItems));
}

function clearAllPending() {
  if (pendingItems.length === 0) {
    showToast('Список уже пуст', '');
    return;
  }
  pendingItems = [];
  localStorage.removeItem('pendingMarks');
  updatePendingList();
  showToast('🗑️ Список очищен', '');
}

function startPushChecker() {
  if (pushCheckInterval) return;
  
  pushCheckInterval = setInterval(() => {
    const now = Date.now();
    let changed = false;
    
    pendingItems.forEach(item => {
      if (item.step === 'waiting' && (now - item.timestamp) >= PUSH_DELAY_MS) {
        item.step = 'notified';
        changed = true;
        
        if (!cameraRunning) {
          document.getElementById('screen-start').classList.add('hidden');
          document.getElementById('screen-scan').classList.add('active');
        }
        showOverlayNotification(item);
      }
    });
    
    if (changed) {
      localStorage.setItem('pendingMarks', JSON.stringify(pendingItems));
      updatePendingList();
    }
  }, 1000);
}

function updatePendingList() {
  const list = document.getElementById('pending-list');
  const count = document.getElementById('pending-count');
  count.textContent = pendingItems.length;
  if (pendingItems.length === 0) {
    list.innerHTML = '<div class="pending-empty">Нет товаров, ожидающих решения</div>';
    return;
  }
  list.innerHTML = '';
  pendingItems.forEach(item => {
    const div = document.createElement('div');
    div.className = `pending-item ${item.step === 'notified' ? 'notified' : item.type}`;
    let statusText = '';
    if (item.type === 'help') {
      statusText = item.step === 'notified' ? '✅ Заявка обработана' : ' Заявка в хелп';
    } else {
      statusText = item.step === 'notified' ? '✅ Статус изменён' : '⏳ Заблокирован ОГВ';
    }
    const time = new Date(item.timestamp).toLocaleString('ru-RU', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
    div.innerHTML = `<div class="pending-status">${statusText}</div><div class="pending-product">${item.productName}</div><div class="pending-time">${time}</div>`;
    list.appendChild(div);
  });
}

function showDemoCodes() {
  const list = document.getElementById('demo-list');
  list.innerHTML = '';
  const labels = { 
    available: '🟢 Доступно', expired: '🔴 Просрочено', written_off: '🔴 Списано ранее', 
    sold: '🔴 Продано ранее', not_ours: '🔴 Не наша марка', no_connection: '🟡 Нет связи', 
    not_in_turnover: '🔵 Не введен в оборот', ogv_blocked: ' Заблокирован ОГВ' 
  };
  for (const mark of MARKS) {
    const item = document.createElement('div');
    item.className = 'demo-item';
    item.innerHTML = `<div class="demo-status">${labels[mark.status]}</div><div class="demo-code" style="margin-bottom:4px">КМ: ${mark.km}</div><div style="font-size:11px;opacity:0.7">${mark.productName} · ${mark.stock}</div>`;
    item.onclick = () => {
      navigator.clipboard.writeText(mark.km).then(() => {
        const el = item.querySelector('.demo-status');
        const orig = el.textContent;
        el.textContent = '✓ Скопирован';
        setTimeout(() => el.textContent = orig, 1000);
      });
    };
    list.appendChild(item);
  }
  document.getElementById('screen-demo').classList.add('active');
}

document.getElementById('btn-scan-back').onclick = async () => {
  hideAllOverlays();
  await stopCamera();
  document.getElementById('screen-scan').classList.remove('active');
  document.getElementById('screen-start').classList.remove('hidden');
  updatePendingList();
};

document.getElementById('btn-notification-close').onclick = () => {
  hideAllOverlays();
  if (!html5QrCode) {
    document.getElementById('screen-scan').classList.remove('active');
    document.getElementById('screen-start').classList.remove('hidden');
    cameraRunning = false;
    updatePendingList();
  }
};

document.getElementById('btn-clear').onclick = clearAllPending;

document.getElementById('btn-test-push').onclick = () => {
  const item = pendingItems.find(p => p.step === 'waiting');
  if (item) {
    item.step = 'notified';
    localStorage.setItem('pendingMarks', JSON.stringify(pendingItems));
    if (!cameraRunning) {
      document.getElementById('screen-start').classList.add('hidden');
      document.getElementById('screen-scan').classList.add('active');
    }
    showOverlayNotification(item);
    updatePendingList();
  } else {
    showToast('Нет ожидающих товаров', 'Отсканируйте марку ОГВ или хелп');
  }
};

document.getElementById('btn-start').onclick = () => {
  if ('speechSynthesis' in window) {
    window.speechSynthesis.getVoices();
    const w = new SpeechSynthesisUtterance('');
    w.volume = 0;
    window.speechSynthesis.speak(w);
  }
  startCamera();
};

document.getElementById('btn-demo').onclick = showDemoCodes;
document.getElementById('btn-demo-back').onclick = () => {
  document.getElementById('screen-demo').classList.remove('active');
};

// НОВОЕ: клик по карточке pending открывает сканер
document.getElementById('pending-list').addEventListener('click', (e) => {
  const item = e.target.closest('.pending-item');
  if (item) {
    startCamera();
  }
});

if ('speechSynthesis' in window) {
  window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
}

startPushChecker();
updatePendingList();
</script>
</body>
